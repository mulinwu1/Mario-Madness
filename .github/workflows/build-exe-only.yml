name: Build Game Exe (vkpkt, exe only)

# 只编 exe：不调用 build-lime-vulkan、不等 ndll job。
# native_vulkan/** 自 cb85f074 未改，ndll 已在上一轮产出，重复 rebuild 纯属浪费。
# ndll 相关硬断言在本文件里全部跳过；只保留 exe 的三条硬断言。
on:
  workflow_dispatch:
    inputs:
      ndll_run_id:
        description: "（可选）build-lime-vulkan 的 run id；留空则不打 artifact，直接用 haxelib lime 自带 ndll"
        required: false
        default: ""
      disable_vk_pkt:
        description: "二分实验：true = 不插入 openfl_vk_pkt 定义（fork 类路径保留），用于定位 13.9GB OOM 来源"
        required: false
        default: ""
      replica_1105:
        description: "对照实验：true = 完全复刻 11-05 输入（haxelib openfl 9.2.0 + PRELOAD_ALL + angle + 不加 vk_pkt/--no-opt）"
        required: false
        default: ""
      replica_vk_pkt:
        description: "对照组 ③：replica_1105 基础上只加 openfl_vk_pkt 一个变量"
        required: false
        default: ""
      frontend_only:
        description: "提速：true = 只要出现第一条 TU 就记 frontend_s 并杀进程（分钟级实验）"
        required: false
        default: ""
      replica_variant:
        description: "复刻组单变量：no_opt / fork / no_preload（空=纯 11-05 复刻）"
        required: false
        default: ""
      ablate:
        description: "单变量减法（基线=今天配置 + disable_vk_pkt=true）：no_opt / no_fork / keep_assets / lime_src；空=基线本身"
        required: false
        default: ""
      verbose:
        description: "诊断：true = 给 haxe 加 -v（逐模块打印），抓最后卡在哪个模块/宏"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  build-vkpkt:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      HAXE_VERSION: 4.2.5
      LIME_VERSION: 8.0.2
      HXCPP_VERSION: 4.3.2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # 前置硬门：分叉源码必须在仓库里（vendor/openfl）。缺了就直接失败，
      # 否则编出来的是上游 openfl 9.2.0，exe 里永远不会有记录侧。
      - name: Assert openfl fork is committed in repo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $need = @(
            'vendor\openfl\haxelib.json',
            'vendor\openfl\src\openfl\display3D\_internal\VKPktNative.hx',
            'vendor\openfl\src\openfl\display3D\_internal\VKDrawSink.hx',
            'vendor\openfl\src\openfl\display3D\Context3D.hx'
          )
          foreach ($f in $need) {
            if (-not (Test-Path $f)) { throw "openfl fork missing in repo: $f (commit vendor/openfl first)" }
          }
          $ctx = Get-Content 'vendor\openfl\src\openfl\display3D\Context3D.hx' -Raw
          if ($ctx -notmatch 'VKPktNative') { throw 'vendor/openfl Context3D.hx has no VKPktNative wiring' }
          Write-Host 'openfl fork present: OK'

      # 可选：只有当外部给了 ndll_run_id 才去下 artifact；缺省完全跳过 ndll 断言
      - name: Download Vulkan lime ndll (optional, given run)
        if: ${{ inputs.ndll_run_id != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download ${{ inputs.ndll_run_id }} -n lime-vulkan-ndll -D lime-vulkan-artifact
          if (-not (Test-Path 'lime-vulkan-artifact\lime.ndll')) { throw 'lime.ndll not found in downloaded artifact' }

      - name: Install Haxe 4.2.5 and Neko
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path C:\haxe | Out-Null
          New-Item -ItemType Directory -Force -Path C:\neko | Out-Null
          Invoke-WebRequest -Uri "https://github.com/HaxeFoundation/haxe/releases/download/4.2.5/haxe-4.2.5-win64.zip" -OutFile C:\haxe\haxe.zip -UseBasicParsing
          Invoke-WebRequest -Uri "https://github.com/HaxeFoundation/neko/releases/download/v2-3-0/neko-2.3.0-win64.zip" -OutFile C:\neko\neko.zip -UseBasicParsing
          Expand-Archive -Path C:\haxe\haxe.zip -DestinationPath C:\haxe -Force
          Expand-Archive -Path C:\neko\neko.zip -DestinationPath C:\neko -Force
          $haxeDir = (Get-ChildItem C:\haxe -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'haxe.exe') } | Select-Object -First 1).FullName
          $nekoDir = (Get-ChildItem C:\neko -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'neko.exe') } | Select-Object -First 1).FullName
          Add-Content -Path $env:GITHUB_ENV -Value "NEKOPATH=$nekoDir"
          Add-Content -Path $env:GITHUB_ENV -Value "HAXE_STD_PATH=$haxeDir\std"
          Add-Content -Path $env:GITHUB_PATH -Value $haxeDir
          Add-Content -Path $env:GITHUB_PATH -Value $nekoDir
          $env:PATH = "$haxeDir;$nekoDir;$env:PATH"
          haxe -version
          neko -version

      - name: Install haxelibs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path "$env:USERPROFILE\haxelib\hxcpp\.current")) { haxelib install hxcpp $env:HXCPP_VERSION }
          haxelib install lime $env:LIME_VERSION
          haxelib install openfl 9.2.0
          haxelib install flixel 5.3.1
          haxelib install flixel-addons 3.1.1
          haxelib install flixel-ui 2.5.0
          haxelib install hxCodec 2.6.1
          haxelib install hscript
          haxelib install discord_rpc
          haxelib install linc_luajit
          haxelib install format
          haxelib install hxp
          haxelib list

      # 用仓库内的分叉 openfl 覆盖 haxelib 里的上游 9.2.0（haxelib dev 不复制、只改解析路径）
      - name: Point openfl at vendor/openfl
        shell: pwsh
        env:
          REPLICA_1105: ${{ inputs.replica_1105 }}
          REPLICA_VARIANT: ${{ inputs.replica_variant }}
          ABLATE: ${{ inputs.ablate }}
        run: |
          $ErrorActionPreference = 'Stop'
          $useFork = $true
          if ($env:REPLICA_1105 -eq 'true' -and $env:REPLICA_VARIANT -ne 'fork') { $useFork = $false }
          if ($env:ABLATE -like '*no_fork*') { $useFork = $false }
          if (-not $useFork) {
            Write-Host "ABLATE/REPLICA: skip haxelib dev (ablate='$env:ABLATE'); use haxelib openfl 9.2.0 as-is"
            $lines = @(haxelib path openfl)
            Write-Host "haxelib path openfl -> $($lines -join '; ')"
            if (@($lines | Where-Object { $_ -match 'vendor' }).Count -gt 0) { throw 'ablate=no_fork but openfl still resolves to vendor' }
          } else {
          $fork = (Resolve-Path 'vendor\openfl').Path
          haxelib dev openfl $fork
          $lines = @(haxelib path openfl)
          Write-Host "haxelib path openfl -> $($lines -join '; ')"
          # 注意：fork 的 haxelib 额外参数会让首行是 --macro（路径在后面行），必须全行匹配
          $hit = @($lines | Where-Object { $_ -match 'vendor\\openfl' -or $_ -match 'vendor/openfl' })
          if ($hit.Count -eq 0) {
            Write-Host '=== haxelib path openfl (first 20 lines) ==='
            $lines | Select-Object -First 20 | ForEach-Object { Write-Host $_ }
            throw "openfl does not resolve to vendor/openfl: no line matches vendor/openfl in $($lines.Count) lines"
          }
          Write-Host "openfl resolves to fork: $($hit[0])"
          Add-Content -Path $env:GITHUB_ENV -Value "OPENFL_VKPKT_FORK=$fork"
          }

      # 定义走 Project.xml（lime 会把它翻成 -D openfl_vk_pkt 写进生成的 hxml）；
      # 幂等插入，重复跑不会叠加。
      - name: Enable openfl_vk_pkt in Project.xml
        shell: pwsh
        env:
          DISABLE_VK_PKT: ${{ inputs.disable_vk_pkt }}
          REPLICA_1105: ${{ inputs.replica_1105 }}
          REPLICA_VK_PKT: ${{ inputs.replica_vk_pkt }}
          REPLICA_VARIANT: ${{ inputs.replica_variant }}
          ABLATE: ${{ inputs.ablate }}
          VERBOSE: ${{ inputs.verbose }}
        run: |
          $ErrorActionPreference = 'Stop'
          $px = Get-Content Project.xml -Raw
          $variant = $env:REPLICA_VARIANT
          if ($env:REPLICA_1105 -eq 'true') {
            # 复刻基线用 PRELOAD_ALL；no_preload 组把它换成 NO_PRELOAD_ALL（单变量）
            $preloadDef = 'PRELOAD_ALL'
            if ($variant -eq 'no_preload') { $preloadDef = 'NO_PRELOAD_ALL' }
            Write-Host "REPLICA 11-05: add $preloadDef + angle defines (11-05 hxml), variant='$variant'"
            $px = $px -replace '</project>', "`t<haxedef name=`"$preloadDef`" />`n`t<haxedef name=`"angle`" />`n</project>"
            if ($env:REPLICA_VK_PKT -eq 'true') {
              $px = $px -replace '</project>', "`t<haxedef name=`"openfl_vk_pkt`" />`n</project>"
              Write-Host 'REPLICA + vk_pkt: openfl_vk_pkt define added (single variable on top of replica)'
            }
            Set-Content -Path Project.xml -Value $px -NoNewline
            $rc = Get-Content Project.xml -Raw
            if ($rc -notmatch ("<haxedef name=`"$preloadDef`"") -or $rc -notmatch '<haxedef name="angle"') { throw "replica defines insert failed ($preloadDef + angle)" }
            if ($env:REPLICA_VK_PKT -eq 'true' -and $rc -notmatch '<haxedef name="openfl_vk_pkt"') { throw 'replica vk_pkt define insert failed' }
          } elseif ($env:DISABLE_VK_PKT -eq 'true') {
            Write-Host 'BISECT PROBE: openfl_vk_pkt define intentionally skipped (fork classpath kept)'
          } elseif ($px -match 'openfl_vk_pkt') {
            Write-Host 'Project.xml already has openfl_vk_pkt'
          } else {
            $px = $px -replace '</project>', "`t<haxedef name=`"openfl_vk_pkt`" />`n</project>"
            Set-Content -Path Project.xml -Value $px -NoNewline
            Write-Host 'inserted <haxedef name="openfl_vk_pkt" />'
          }
          $check = Get-Content Project.xml -Raw
          if ($check -notmatch '<haxedef name="openfl_vk_pkt"' -and $env:DISABLE_VK_PKT -ne 'true' -and $env:REPLICA_1105 -ne 'true') { throw 'failed to enable openfl_vk_pkt in Project.xml' }

          # 诊断仪器：-v 让 haxe 逐模块打印；卡住时日志最后一条就指向嫌疑模块/宏
          if ($env:VERBOSE -eq 'true') {
            $pv = Get-Content Project.xml -Raw
            if ($pv -match '<haxeflag name="-v"') {
              Write-Host 'Project.xml already has <haxeflag name="-v" />'
            } else {
              $pv = $pv -replace '</project>', "`t<haxeflag name=`"-v`" />`n`t<haxedef name=`"macro-times`" />`n</project>"
              Set-Content -Path Project.xml -Value $pv -NoNewline
              Write-Host 'inserted <haxeflag name="-v" /> + <haxedef name="macro-times" /> (verbose diagnostic)'
            }
            $vf = Get-Content Project.xml -Raw
            if ($vf -notmatch '<haxeflag name="-v"') { throw 'failed to insert -v haxeflag' }
          }

          # 内存实验 1/2：analyzer-optimize 是已知的内存翻倍项。源侧核查结论：
          # lime 8.0.2 (HXProject/ProjectXMLParser/Platform) 与仓库 Project.xml 都没有它，
          # 所以这里只做"确认没有"，若以后有人加进来会立刻在日志里暴露。
          $ao = @(Select-String -Path Project.xml -Pattern 'analyzer-optimize' -ErrorAction SilentlyContinue)
          if ($ao.Count -gt 0) { Write-Host "WARN: Project.xml 出现 analyzer-optimize（内存翻倍项）：$($ao[0].Line.Trim())" }
          else { Write-Host 'analyzer-optimize: absent in Project.xml (lime 8.0.2 默认也不加)' }

          # 内存实验 2/2：本轮显式关掉 haxe 优化器（--no-opt），降低编译器峰值内存；
          # 幂等插入，只影响 CI 里的这份 Project.xml，不改仓库文件
          $needNoOpt = $true
          if ($env:REPLICA_1105 -eq 'true' -and $variant -ne 'no_opt') { $needNoOpt = $false }
          if ($env:ABLATE -like '*no_opt*') { $needNoOpt = $false }
          if (-not $needNoOpt) {
            Write-Host "ABLATE/REPLICA: skip --no-opt (ablate='$env:ABLATE', variant='$variant')"
          } elseif ($check -match '--no-opt') {
            Write-Host 'Project.xml already has <haxeflag name="--no-opt" />'
          } else {
            $px2 = Get-Content Project.xml -Raw
            $px2 = $px2 -replace '</project>', "`t<haxeflag name=`"--no-opt`" />`n</project>"
            Set-Content -Path Project.xml -Value $px2 -NoNewline
            Write-Host 'inserted <haxeflag name="--no-opt" /> (memory experiment)'
          }
          $final = Get-Content Project.xml -Raw
          if ($final -notmatch 'no-opt' -and $needNoOpt) { throw 'failed to insert --no-opt' }
          Write-Host "project.xml variant='$variant' needNoOpt=$needNoOpt fork=$(if ($env:REPLICA_1105 -eq 'true') { if ($variant -eq 'fork') { 'YES' } else { 'NO' } } else { 'YES' })"

      # 有 artifact 就覆盖 haxelib 里的 ndll；没有就原地用 haxelib lime 自带的那份，
      # 并记录 VULKAN_LIME_NDLL 供打包步骤贴到 exe 旁边。
      - name: Wire lime ndll into haxelib lime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devFile = "$env:USERPROFILE\haxelib\.dev\lime"
          if (Test-Path $devFile) { Write-Host 'removing stale lime dev entry'; Remove-Item $devFile -Force }
          $limeRoot = "$env:USERPROFILE\haxelib\lime\$($env:LIME_VERSION -replace '\.',',')"
          if (-not (Test-Path $limeRoot)) { throw "haxelib lime not found: $limeRoot" }
          $targets = @(Get-ChildItem "$limeRoot\ndll" -Recurse -Filter 'lime.ndll' -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
          Write-Host "--- ndll dirs under haxelib lime ---"
          Get-ChildItem "$limeRoot\ndll" -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          # Windows runner 上必须取 Windows 版 ndll：递归取的第一个是 Linux\lime.ndll，拷到 exe 旁边必然失败
          $winCandidates = @("$limeRoot\ndll\Windows64\lime.ndll", "$limeRoot\ndll\Windows\lime.ndll")
          $winNdll = @($winCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1)
          $artifact = $null
          if (Test-Path 'lime-vulkan-artifact\lime.ndll') { $artifact = (Resolve-Path 'lime-vulkan-artifact\lime.ndll').Path }
          if ($winNdll.Count -eq 0) {
            Write-Host "WARN: haxelib lime 下没有 Windows 版 lime.ndll (候选 $($winCandidates -join ' ; ')); 跳过 ndll 拷贝"
          } else {
            if ($artifact) { Copy-Item $artifact $winNdll[0] -Force; Write-Host "patched with Vulkan artifact: $($winNdll[0])" }
            else { Write-Host 'no ndll artifact: keep haxelib lime Windows ndll as-is (exe-only run)' }
            Write-Host "VULKAN_LIME_NDLL=$($winNdll[0]) exists=$((Test-Path $winNdll[0])) size=$((Get-Item $winNdll[0]).Length)"
            Add-Content -Path $env:GITHUB_ENV -Value "VULKAN_LIME_NDLL=$($winNdll[0])"
          }
          if ($targets.Count -gt 0) { Write-Host "all lime.ndll found: $($targets.Count)" }
          $shim = (Resolve-Path 'lime-vulkan-artifact\lime_glslang.dll' -ErrorAction SilentlyContinue)
          if ($shim) { Add-Content -Path $env:GITHUB_ENV -Value "VULKAN_LIME_SHIM=$($shim.Path)" }
          else { Write-Host 'WARN: lime_glslang.dll not in artifact; packaging will rely on the local shim' }

      # 11-05 那次用的是 lime 源码（haxelib dev lime C:\lime-src），今天用的是 haxelib 发行包。
      # 单变量：把 lime 也换成 8.0.2 源码，其余不动。
      - name: Point lime at 8.0.2 source (ablate=lime_src)
        if: ${{ contains(inputs.ablate, 'lime_src') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'C:\lime-src')) {
            git clone --depth 1 --branch 8.0.2 --recursive --shallow-submodules https://github.com/openfl/lime.git C:\lime-src
          }
          haxelib dev lime C:\lime-src
          $lines = @(haxelib path lime)
          Write-Host "haxelib path lime -> $($lines -join '; ')"
          if (@($lines | Where-Object { $_ -match 'lime-src' }).Count -eq 0) { throw 'ablate=lime_src but lime does not resolve to C:\lime-src' }
          # 把现有 Windows ndll 预置进源码树，避免 lime 在 haxe 前端之前先跑 native rebuild（会污染前端判据）
          if ($env:VULKAN_LIME_NDLL -and (Test-Path $env:VULKAN_LIME_NDLL)) {
            New-Item -ItemType Directory -Force -Path 'C:\lime-src\ndll\Windows64' | Out-Null
            Copy-Item $env:VULKAN_LIME_NDLL 'C:\lime-src\ndll\Windows64\lime.ndll' -Force
            Write-Host "seeded lime.ndll into source tree: size=$((Get-Item 'C:\lime-src\ndll\Windows64\lime.ndll').Length)"
          } else { Write-Host 'WARN: VULKAN_LIME_NDLL unavailable; lime source may trigger a native rebuild' }
          Write-Host 'lime source dirs:'
          Get-ChildItem 'C:\lime-src\src\lime' -Directory -ErrorAction SilentlyContinue | Select-Object -First 8 -ExpandProperty Name | ForEach-Object { Write-Host "  $_" }

      # -v 证据：ShaderMacro.build 最后一个 "Calling" 没有 "Exiting"，指向 11-06 那批 ES 1.00 改过的 shader。
      # revert_ycbu = 只回滚 YCBUEndingShader；revert_shaders = 三个文件全部回滚到改前版本。
      - name: Ablate - restore 11-06 shaders (revert_ycbu / revert_shaders)
        if: ${{ contains(inputs.ablate, 'revert_ycbu') || contains(inputs.ablate, 'revert_shaders') || contains(inputs.ablate, 'revert_oldtv') || contains(inputs.ablate, 'revert_vcr') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ABLATE: ${{ inputs.ablate }}
        run: |
          $ErrorActionPreference = 'Stop'
          $all = @(
            @{ p = 'source\YCBUEndingShader.hx'; ref = '43e1f769bb9eaa577e447a7b37ae556e54cd9677' },
            @{ p = 'source\OldTVShader.hx';      ref = 'afcdbab9135128ad857f0d2981dcb1e0ff70747a' },
            @{ p = 'source\VCRMario85.hx';       ref = '6a016b547ddf088272c363a9fcd5d994f38ddac7' }
          )
          $targets = @()
          if ($env:ABLATE.Contains('revert_shaders')) { $targets = @(0, 1, 2) }
          else {
            if ($env:ABLATE.Contains('revert_ycbu'))  { $targets += 0 }
            if ($env:ABLATE.Contains('revert_oldtv')) { $targets += 1 }
            if ($env:ABLATE.Contains('revert_vcr'))   { $targets += 2 }
          }
          if ($targets.Count -eq 0) { throw 'no revert target selected' }
          foreach ($idx in $targets) {
            $t = $all[$idx]
            $p = $t.p
            $rel = $p -replace '\\', '/'
            Write-Host "before: $p size=$((Get-Item $p).Length)"
            $b64 = gh api "repos/$env:REPO/contents/$rel`?ref=$($t.ref)" --jq '.content'
            $txt = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($b64 -replace "`r?`n", '')))
            Set-Content -Path $p -Value $txt -NoNewline
            Write-Host "after:  $p size=$((Get-Item $p).Length) lines=$((Get-Content $p).Count)"
            if ((Get-Content $p -Raw) -match 'ES 1\.00') { Write-Host "WARN: $p still mentions ES 1.00 (revert may be a no-op)" }
          }

      # discord_rpc 的 native 源码 haxelib 包里缺失，需要手工补齐（与既有构建一致）
      - name: Patch discord_rpc native sources
        shell: pwsh
        run: |
          $drRoot = "$env:USERPROFILE\haxelib\discord_rpc"
          $verDir = Get-ChildItem $drRoot -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^\d' } | Select-Object -First 1
          if (-not $verDir) { Write-Host 'discord_rpc dir missing, skip'; exit 0 }
          $header = Join-Path $verDir.FullName "lib\discord-rpc\include\discord-rpc.h"
          if (-not (Test-Path $header)) {
            $tmp = "C:\discord-rpc-src"
            git clone --depth 1 --branch v2.1.0 --recursive --shallow-submodules https://github.com/discord/discord-rpc.git $tmp
            New-Item -ItemType Directory -Force -Path (Join-Path $verDir.FullName "lib\discord-rpc") | Out-Null
            Copy-Item "$tmp\include" (Join-Path $verDir.FullName "lib\discord-rpc\include") -Recurse -Force
            Copy-Item "$tmp\src" (Join-Path $verDir.FullName "lib\discord-rpc\src") -Recurse -Force
          }
          $inc = Join-Path $verDir.FullName "lib\discord-rpc\include"
          if (Test-Path "$inc\discord_rpc.h") { Copy-Item "$inc\discord_rpc.h" "$inc\discord-rpc.h" -Force }
          $rj = "C:\rapidjson-src"
          git clone --depth 1 https://github.com/Tencent/rapidjson.git $rj
          New-Item -ItemType Directory -Force -Path (Join-Path $verDir.FullName "lib\discord-rpc\src\rapidjson") | Out-Null
          Copy-Item "$rj\include\rapidjson\*" (Join-Path $verDir.FullName "lib\discord-rpc\src\rapidjson") -Recurse -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $inc "rapidjson") | Out-Null
          Copy-Item "$rj\include\rapidjson\*" (Join-Path $inc "rapidjson") -Recurse -Force

      # 提交上限诊断 + 尝试把页面文件调大：免费手段里唯一能抬高"物理内存 + 页面文件"这条路
      - name: Pagefile and commit limit (memory experiment)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Continue'
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host ("BEFORE os: TotalVisible={0} MB TotalVirtual={1} MB FreeVirtual={2} MB FreePhysical={3} MB" -f $os.TotalVisibleMemorySize, $os.TotalVirtualMemorySize, $os.FreeVirtualMemory, $os.FreePhysicalMemory)
          foreach ($p in @(Get-CimInstance Win32_PageFileSetting -ErrorAction SilentlyContinue)) {
            Write-Host ("BEFORE pagefile setting: {0} Initial={1} MB Maximum={2} MB" -f $p.Name, $p.InitialSize, $p.MaximumSize)
          }
          foreach ($p in @(Get-CimInstance Win32_PageFileUsage -ErrorAction SilentlyContinue)) {
            Write-Host ("BEFORE pagefile usage: {0} AllocatedBase={1} MB Current={2} MB Peak={3} MB" -f $p.Name, $p.AllocatedBaseSize, $p.CurrentUsage, $p.PeakUsage)
          }
          Write-Host ("BEFORE commit: used={0} MB limit={1} MB" -f ($os.TotalVirtualMemorySize - $os.FreeVirtualMemory), $os.TotalVirtualMemorySize)
          try {
            $drv = @(Get-CimInstance Win32_PageFileSetting -ErrorAction SilentlyContinue) | Select-Object -First 1
            if (-not $drv) {
              Write-Host 'SET skipped: no Win32_PageFileSetting (system-managed pagefile)'
            } else {
              $drv | Set-CimInstance -Property @{ InitialSize = 32768; MaximumSize = 32768 } -ErrorAction Stop
              Write-Host "SET requested Initial=Maximum=32768 MB on $($drv.Name)"
            }
          } catch { Write-Host "SET failed: $($_.Exception.Message)" }
          Start-Sleep -Seconds 3
          foreach ($p in @(Get-CimInstance Win32_PageFileSetting -ErrorAction SilentlyContinue)) {
            Write-Host ("AFTER pagefile setting: {0} Initial={1} MB Maximum={2} MB" -f $p.Name, $p.InitialSize, $p.MaximumSize)
          }
          $pu = @(Get-CimInstance Win32_PageFileUsage -ErrorAction SilentlyContinue)
          foreach ($p in $pu) { Write-Host ("AFTER pagefile usage: {0} AllocatedBase={1} MB" -f $p.Name, $p.AllocatedBaseSize) }
          $os2 = Get-CimInstance Win32_OperatingSystem
          Write-Host ("AFTER os: TotalVirtual={0} MB FreeVirtual={1} MB" -f $os2.TotalVirtualMemorySize, $os2.FreeVirtualMemory)
          $allocated = 0
          if ($pu.Count -gt 0) { $allocated = [int]$pu[0].AllocatedBaseSize }
          if ($allocated -lt 32768) {
            Write-Host 'CONCLUSION: pagefile NOT effective within this job (resize needs reboot) -> not usable in one run'
          } else {
            Write-Host 'CONCLUSION: pagefile effective within this job; commit limit can grow'
          }

      # 冷构建：不使用任何 hxcpp/obj 缓存（单变量原则），保证产物一定是本轮新编的
      # 单阶段：haxe 前台跑（输出实时进 Actions 日志）+ 独立监控进程（每 60s 一行心跳，卡死自动 taskkill）
      - name: Build game with openfl_vk_pkt
        shell: pwsh
        timeout-minutes: 150
        env:
          REPLICA_1105: ${{ inputs.replica_1105 }}
          FRONTEND_ONLY: ${{ inputs.frontend_only }}
          ABLATE: ${{ inputs.ablate }}
          VERBOSE: ${{ inputs.verbose }}
        run: |
          $ErrorActionPreference = 'Stop'
          $buildStart = (Get-Date).ToUniversalTime()
          Add-Content -Path $env:GITHUB_ENV -Value "VKPKT_BUILD_START=$($buildStart.ToString('o'))"
          $outDir = "export\release\windows"
          if ($env:REPLICA_1105 -eq 'true') {
            Write-Host 'REPLICA 11-05: keep assets as-is (11-05 compiled with full assets + PRELOAD_ALL)'
          } elseif ($env:ABLATE -like '*keep_assets*') {
            Write-Host 'ABLATE keep_assets: skip assets wipe (restore the full asset set)'
          } else {
          Get-ChildItem 'assets' -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            Get-ChildItem $_.FullName -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }
          }
          $hx = (Get-Command haxelib).Source
          $wd = (Get-Location).Path
          Remove-Item build.log, build.err, hb.log, stall.txt, monitor.ps1 -ErrorAction SilentlyContinue
          Write-Host "openfl fork: $env:OPENFL_VKPKT_FORK"
          $cs = Get-CimInstance Win32_ComputerSystem
          Write-Host ("host memory: {0:N1} GB physical, {1} logical cores" -f ($cs.TotalPhysicalMemory/1GB), $env:NUMBER_OF_PROCESSORS)
          Write-Host 'hxcpp: 默认并行(=逻辑核数) + -D HXCPP_FAST_LINK；不传 -debug => 无 -Zi/无 vc.pdb'
          haxelib list

          $stageArgs = @('run','lime','build','windows','-D','HXCPP_FAST_LINK')
          if ($env:REPLICA_1105 -eq 'true') { $stageArgs = @('run','lime','build','windows','-D','angle') }
          Write-Host "cmd: $hx $($stageArgs -join ' ')"

          # 监控脚本：三个信号全部实测（取不到的写 NA，不写 0 假装有数）
          # 1) haxe 累计 CPU 秒 + 与上次采样的增量 —— 增量 >0 就是"在动"的硬证据
          # 2) haxe 工作集 MB
          # 3) export 下 .cpp 数量与总字节（haxe 生成完会从 0 跳到几千）
          # 另有 obj 数作为第二条硬证据；判定卡死 = haxe_cpu 连续 10 次采样无增量 且 cpp/obj 都没涨
          Set-Content -Path monitor.ps1 -Encoding UTF8 -Value @'
          param([string]$Wd, [string]$Marker, [string]$HbLog, [int]$MaxMin = 110, [int]$StallSamples = 10, [switch]$FrontendOnly, [int]$GateS = 600)
          Set-Location $Wd
          $t0 = Get-Date
          $prevCpu = 0.0
          $prevCpp = -1
          $prevObj = -1
          $lowCpu = 0
          $flat = 0
          $peak = 0
          $peakCommit = 0
          function Kill-Tree {
            foreach ($p in @(Get-Process -Name haxe, haxelib, neko, cl, link, c2 -ErrorAction SilentlyContinue)) {
              & taskkill /PID $p.Id /T /F 2>&1 | Out-Null
            }
          }
          while ($true) {
            Start-Sleep -Seconds 60
            $elapsed = [int]((Get-Date) - $t0).TotalSeconds
            $hp = @(Get-Process -Name haxe -ErrorAction SilentlyContinue)
            if ($hp.Count -gt 0) {
              $cpu = [double](($hp | Measure-Object -Property CPU -Sum).Sum)
              $wsSum = ($hp | Measure-Object -Property WorkingSet64 -Sum).Sum
              if ($wsSum) { $mem = [string][int][math]::Round($wsSum / 1MB) } else { $mem = 'NA' }
              $delta = [math]::Round($cpu - $prevCpu, 1)
              $prevCpu = $cpu
            } else {
              $cpu = 0.0
              $mem = 'NA'
              $delta = 0.0
              $prevCpu = 0.0
            }
            $cpp = @(Get-ChildItem 'export' -Recurse -Filter '*.cpp' -File -ErrorAction SilentlyContinue)
            $cppCount = $cpp.Count
            $cppMB = 0
            if ($cppCount -gt 0) { $cppMB = [int][math]::Round((($cpp | Measure-Object -Property Length -Sum).Sum) / 1MB) }
            $objCount = @(Get-ChildItem 'export' -Recurse -Filter '*.obj' -File -ErrorAction SilentlyContinue).Count
            # 提交上限：TotalVirtualMemorySize - FreeVirtualMemory = 当前已提交；limit = 物理内存 + 页面文件
            $os = Get-CimInstance Win32_OperatingSystem
            $commitMB = [int][math]::Round(($os.TotalVirtualMemorySize - $os.FreeVirtualMemory) / 1KB)
            $limitMB = [int][math]::Round($os.TotalVirtualMemorySize / 1KB)
            # 心跳追加"当前进度"：build.log 最后一个非空行（截断 100 字符），把内存爬升对到具体模块
            $blPath = Join-Path $Wd 'build.log'
            $lastLine = ''
            if (Test-Path $blPath) {
              $tail = @(Get-Content $blPath -Tail 10 -ErrorAction SilentlyContinue)
              for ($ti = $tail.Count - 1; $ti -ge 0; $ti--) { if ($tail[$ti].Trim() -ne '') { $lastLine = $tail[$ti].Trim(); break } }
            }
            if ($lastLine.Length -gt 100) { $lastLine = $lastLine.Substring(0, 100) }
            Write-Host ("::notice::[hb] elapsed=${elapsed}s haxe_cpu=${cpu}s (+${delta}) mem=${mem}MB commit=${commitMB}MB/${limitMB}MB cpp=${cppCount} files=${cppMB}MB obj=${objCount} last=$lastLine")
            Add-Content -Path $HbLog -Value ("[hb] elapsed=${elapsed}s haxe_cpu=${cpu}s (+${delta}) mem=${mem}MB commit=${commitMB}MB/${limitMB}MB cpp=${cppCount} files=${cppMB}MB obj=${objCount} last=$lastLine")
            if ($mem -ne 'NA' -and [int]$mem -gt $peak) { $peak = [int]$mem }
            if ($commitMB -gt $peakCommit) { $peakCommit = $commitMB }
            Set-Content -Path (Join-Path $Wd 'peak_mem.txt') -Value ("peak_haxe_mem_MB=$peak`npeak_commit_MB=$peakCommit`ncommit_limit_MB=$limitMB`nelapsed_s=$elapsed`nhaxe_cpu_s=$cpu")
            # 前端判据：只认"游戏自己的 haxe 前端已过"——必须先出现 hxcpp 对游戏源码的编译组
            # （Compiling group: haxe 或命令行含 export\release\windows\...obj），之后的 TU 行才算数。
            # 否则 lime 自身的 native rebuild（-Fd C:\lime-src\project\obj）会误判为前端完成。
            if ($FrontendOnly) {
              $bl = Join-Path $Wd 'build.log'
              $tuHit = @()
              $anchor = -1
              $anchorLine = ''
              if (Test-Path $bl) {
                $ls = @(Get-Content $bl -ErrorAction SilentlyContinue)
                for ($i = 0; $i -lt $ls.Count; $i++) {
                  if ($ls[$i] -match 'Compiling group:\s*haxe' -or $ls[$i] -match 'export[\\/]release[\\/]windows[\\/][^ ]*\.obj') { $anchor = $i; $anchorLine = $ls[$i].Trim() }
                }
                if ($anchor -ge 0) {
                  for ($i = $anchor; $i -lt $ls.Count; $i++) {
                    if ($ls[$i] -match '^\s*-\s+\S+\.cpp\s*$') { $tuHit += $i }
                  }
                }
              }
              if ($tuHit.Count -gt 0) {
                $firstIdx = $tuHit[0]
                $cmdLine = ''
                for ($i = $firstIdx; $i -ge 0; $i--) {
                  if ($ls[$i] -match 'cl\.exe|cl ' -and $ls[$i] -match 'export') { $cmdLine = $ls[$i].Trim(); break }
                }
                if ($cmdLine -eq '' -and $firstIdx -gt 0) { $cmdLine = $ls[$firstIdx - 1].Trim() }
                if ($cmdLine.Length -gt 120) { $cmdLine = $cmdLine.Substring(0, 120) }
                $tuLine = $ls[$firstIdx].Trim()
                Set-Content -Path (Join-Path $Wd 'frontend.txt') -Value ("frontend_s=$elapsed`ntu_lines=$($tuHit.Count)`nanchor=$anchorLine`nfirst_tu=$tuLine`ncl_cmd=$cmdLine")
                Write-Host ("::notice::[frontend] game TU reached at ${elapsed}s -> killing for frontend-only measurement")
                Kill-Tree
                break
              }
              # 判据：GateS 内没出现第一条游戏 TU 即视为病态前端，直接杀（-v 诊断用 180s）
              if ($elapsed -ge $GateS) {
                Set-Content -Path $Marker -Value "FRONTEND_TIMEOUT no game TU within ${GateS}s (elapsed=${elapsed}s mem=${mem}MB haxe_cpu=${cpu}s cpp=$cppCount)"
                Set-Content -Path (Join-Path $Wd 'frontend.txt') -Value ("frontend_s=NOT_REACHED`ngate_s=$GateS`nmem_MB=$mem`nhaxe_cpu_s=$cpu")
                Write-Host ("::notice::[frontend] NO game TU within ${GateS}s -> pathological, killing")
                Kill-Tree
                break
              }
            }
            # 病态停滞：连续 3 分钟 cpp 仍为 0 且 haxe_cpu 增量 < 30s/分 => 低 CPU 横盘，直接杀
            if ($cppCount -eq 0 -and $delta -lt 30) { $lowCpu++ } else { $lowCpu = 0 }
            if ($lowCpu -ge 3) {
              Set-Content -Path $Marker -Value "STALL_LOWCPU cpp=0 for $lowCpu samples with haxe_cpu delta<30s/min (elapsed=${elapsed}s mem=${mem}MB last_delta=${delta}s haxe_cpu=${cpu}s)"
              Set-Content -Path (Join-Path $Wd 'frontend.txt') -Value ("frontend_s=STALL_LOWCPU`ngate=samples=3`nmem_MB=$mem`nhaxe_cpu_s=$cpu`ndelta_s=$delta")
              Write-Host ("::notice::[frontend] pathological stall: cpp=0 and haxe_cpu delta=${delta}s/min for 3 samples -> killing")
              Kill-Tree
              break
            }
            # 硬护栏：haxe 堆超过 13500MB 就主动杀，记录 ABORT_MEM，不等它自己崩（每轮省 10 分钟）
            if ($mem -ne 'NA' -and [int]$mem -gt 13500) {
              Set-Content -Path $Marker -Value "ABORT_MEM mem=${mem}MB elapsed=${elapsed}s cpp=$cppCount obj=$objCount haxe_cpu=${cpu}s"
              Kill-Tree
              break
            }
            if ($delta -le 0 -and $cppCount -eq $prevCpp -and $objCount -eq $prevObj) { $flat++ } else { $flat = 0 }
            $prevCpp = $cppCount
            $prevObj = $objCount
            if ($elapsed -ge ($MaxMin * 60)) {
              Set-Content -Path $Marker -Value "stage hard timeout ${MaxMin}m (elapsed=${elapsed}s cpp=$cppCount obj=$objCount)"
              Kill-Tree
              break
            }
            if ($flat -ge $StallSamples) {
              Set-Content -Path $Marker -Value "stall: haxe_cpu delta=0 for $flat samples (~${flat}m); cpp=$cppCount obj=$objCount"
              Kill-Tree
              break
            }
          }
          '@

          $monArgs = @('-NoProfile','-ExecutionPolicy','Bypass','-File', (Join-Path $wd 'monitor.ps1'),
                       '-Wd', $wd, '-Marker', (Join-Path $wd 'stall.txt'), '-HbLog', (Join-Path $wd 'hb.log'),
                       '-MaxMin', '110', '-StallSamples', '10')
          if ($env:FRONTEND_ONLY -eq 'true') { $monArgs += @('-FrontendOnly') }
          if ($env:VERBOSE -eq 'true') { $monArgs += @('-GateS', '180') } else { $monArgs += @('-GateS', '600') }
          $monProc = Start-Process -FilePath (Get-Command pwsh).Source -ArgumentList $monArgs -NoNewWindow -PassThru
          Write-Host "monitor: frontend_only=$($env:FRONTEND_ONLY) verbose=$($env:VERBOSE)"

          # 前台跑：stdout 逐行实时打到 Actions 日志并落 build.log；stderr 落 build.err
          $runStart = Get-Date
          & $hx @stageArgs 2> build.err | ForEach-Object {
            Add-Content -Path 'build.log' -Value "$_" -Encoding UTF8
            Write-Host "$_"
          }
          $code = $LASTEXITCODE
          if ($null -eq $code) { $code = -1 }
          $dur = [int]((Get-Date) - $runStart).TotalSeconds
          Stop-Process -Id $monProc.Id -Force -ErrorAction SilentlyContinue
          $stalled = Test-Path 'stall.txt'
          Write-Host "build: exit=$code duration=${dur}s stalled=$stalled"
          Write-Host '=== hb tail 8 ==='
          Get-Content hb.log -Tail 8 -ErrorAction SilentlyContinue
          if ($stalled) { Write-Host ("kill reason: " + ((Get-Content stall.txt -Raw) -replace "`r?`n", ' ')) }
          # 证据：生成的 hxml 里 analyzer-optimize 到底有没有、--no-opt 是否真的进去了
          $hxmls = @(Get-ChildItem 'export' -Recurse -Filter '*.hxml' -File -ErrorAction SilentlyContinue)
          Write-Host ("hxml files: {0}" -f $hxmls.Count)
          foreach ($h in $hxmls) {
            $raw = Get-Content $h.FullName -Raw
            $aoState = 'ABSENT'
            if ($raw -match 'analyzer-optimize') { $aoState = 'PRESENT' }
            $nooptState = 'ABSENT'
            if ($raw -match 'no-opt') { $nooptState = 'PRESENT' }
            Write-Host ("hxml {0}: analyzer-optimize={1} no-opt={2}" -f $h.Name, $aoState, $nooptState)
            $defs = @(Get-Content $h.FullName | Where-Object { $_ -match '^\s*-D|no-opt|analyzer-optimize' })
            Write-Host ("  hxml defines(" + $defs.Count + "): " + ($defs -join ' '))
          }
          if ($code -ne 0 -or $stalled) {
            Write-Host '=== build.err (full) ==='
            $errLines = @(Get-Content build.err -ErrorAction SilentlyContinue)
            if ($errLines.Count -eq 0) { Write-Host '(build.err is empty)' } else { $errLines | ForEach-Object { Write-Host $_ } }
            Write-Host '=== build.log tail 60 ==='
            Get-Content build.log -Tail 60 -ErrorAction SilentlyContinue
            throw "build failed: exit=$code stalled=$stalled duration=${dur}s"
          }

          Get-ChildItem $outDir -Recurse -Filter 'Mario.exe' -File -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime | Format-Table -AutoSize
          # lime 把 ndll 放在 applicationDirectory（export\release\windows\bin），直接贴着 exe 放
          $builtExe = Get-ChildItem $outDir -Recurse -Filter 'Mario.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $builtExe) { throw "no Mario.exe produced under $outDir" }
          if ($env:VULKAN_LIME_NDLL -and (Test-Path $env:VULKAN_LIME_NDLL)) {
            Write-Host "lime.ndll source exists: $env:VULKAN_LIME_NDLL"
            Copy-Item $env:VULKAN_LIME_NDLL (Join-Path $builtExe.Directory.FullName 'lime.ndll') -Force
          } else {
            Write-Host "WARN: VULKAN_LIME_NDLL 不可用('$env:VULKAN_LIME_NDLL')；跳过 ndll 拷贝"
          }
          if ($env:VULKAN_LIME_SHIM -and (Test-Path $env:VULKAN_LIME_SHIM)) { Copy-Item $env:VULKAN_LIME_SHIM (Join-Path $builtExe.Directory.FullName 'lime_glslang.dll') -Force }

      # 关键断言 1：生成的 hxml 里必须同时出现分叉 classpath 与 openfl_vk_pkt
      - name: Assert generated hxml wired to fork + define
        if: ${{ inputs.replica_1105 != 'true' && inputs.frontend_only != 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hxmls = @(Get-ChildItem 'export' -Recurse -Filter '*.hxml' -File -ErrorAction SilentlyContinue)
          if ($hxmls.Count -eq 0) { throw 'no generated .hxml under export; cannot verify define wiring' }
          $hit = @()
          foreach ($h in $hxmls) {
            $t = Get-Content $h.FullName -Raw
            if ($t -match 'openfl_vk_pkt' -and $t -match 'vendor[/\\]openfl') { $hit += $h.FullName }
          }
          if ($hit.Count -eq 0) {
            $sample = Get-Content $hxmls[0].FullName -Raw
            Write-Host "=== first hxml ($($hxmls[0].FullName)) ==="
            Write-Host $sample
            throw 'generated hxml has no (vendor/openfl classpath + openfl_vk_pkt) combination'
          }
          Write-Host "wiring OK: $($hit -join '; ')"

      # 关键断言 2：exe 里必须搜到记录侧符号，且 exe 是本轮新编的（不是缓存旧物）
      - name: Assert exe contains packet recorder and is freshly built
        if: ${{ inputs.replica_1105 != 'true' && inputs.frontend_only != 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem 'export\release\windows' -Recurse -Filter 'Mario.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'Mario.exe not found under export\release\windows' }
          $txt = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe.FullName))
          foreach ($sym in @('lime_vk_pkt_emit','VKDrawSink','VKPktNative','[vkpkt]')) {
            if (-not $txt.Contains($sym)) { throw "exe missing packet recorder symbol: $sym" }
          }
          if (-not $txt.Contains('lime_gl_draw_arrays')) { throw 'exe missing control symbol lime_gl_draw_arrays (scan invalid)' }
          $start = [datetime]::Parse($env:VKPKT_BUILD_START).ToUniversalTime()
          if ($exe.LastWriteTime.ToUniversalTime() -lt $start) {
            throw "Mario.exe is stale (not rebuilt this run): mtime=$($exe.LastWriteTime.ToUniversalTime().ToString('o')) start=$($start.ToString('o'))"
          }
          Write-Host "exe OK: $($exe.FullName) size=$($exe.Length) mtime=$($exe.LastWriteTime.ToUniversalTime().ToString('o'))"
          Add-Content -Path $env:GITHUB_ENV -Value "VKPKT_EXE=$($exe.FullName)"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-vkpkt-exe-only
          path: |
            build.log
            build.err
            hb.log
            stall.txt
            peak_mem.txt
            frontend.txt
          if-no-files-found: warn
          retention-days: 7

      # 独立产物名与目录：不覆盖既有 mario-vulkan-win64 包，也不碰本地 angle_full\bin\Mario.exe
      - name: Assemble package (vk pkt)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item pkg-vkpkt -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path pkg-vkpkt | Out-Null
          $exe = Get-Item $env:VKPKT_EXE
          $ndll = Join-Path $exe.Directory.FullName 'lime.ndll'
          Copy-Item $exe.FullName pkg-vkpkt
          if (Test-Path $ndll) { Copy-Item $ndll pkg-vkpkt } else { Write-Host 'WARN: no lime.ndll next to exe; package ships exe only' }
          Get-ChildItem $exe.Directory -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.dll', '.ico' } | ForEach-Object { Copy-Item $_.FullName pkg-vkpkt -Force }
          $lines = @(
            'Mario Madness - vkpkt exe (openfl_vk_pkt recorder; exe-only run)',
            '',
            '[run]',
            '  set VK_PKT=1',
            '  set VK_PKT_EXEC=1',
            '  set VK_PKT_FRAMES=all',
            '  Mario.exe',
            '',
            '[deploy]',
            '  extract into vk_test_vkpkt\ (separate dir). Never overwrite angle_full\bin\Mario.exe.'
          )
          Set-Content -Path pkg-vkpkt\RUNNING.txt -Value $lines -Encoding UTF8
          Get-ChildItem pkg-vkpkt | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload vkpkt package
        uses: actions/upload-artifact@v7
        with:
          name: mario-vulkan-win64-vkpkt-exe-only
          path: pkg-vkpkt/*
          if-no-files-found: error
          retention-days: 7
