name: Build Vulkan Demo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Vulkan Headers
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git vkh
          Test-Path vkh\include\vulkan\vulkan.h

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile
        shell: pwsh
        run: |
          cl /EHsc /O2 /std:c++17 /I vkh\include native_vulkan\main.cpp /link user32.lib gdi32.lib /out:vulkan_demo.exe
          if (Test-Path vulkan_demo.exe) { Get-Item vulkan_demo.exe | Select-Object Name, Length } else { exit 1 }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-demo
          path: vulkan_demo.exe
          retention-days: 7
