name: Build Vulkan Demo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Vulkan Headers
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git vkh
          Test-Path vkh\include\vulkan\vulkan.h

      - name: Fetch glslang
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-windows-x86_64-release.zip" -OutFile glslang.zip -UseBasicParsing
          Expand-Archive glslang.zip -DestinationPath glslang -Force
          Get-ChildItem glslang -Recurse -Filter "glslang.exe" | Select-Object FullName

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile shaders
        shell: pwsh
        run: |
          $gl = (Get-ChildItem glslang -Recurse -Filter "glslang.exe" | Select-Object -First 1).FullName
          if (-not $gl) { throw "glslang.exe not found" }
          & $gl -V native_vulkan\shader.vert -o native_vulkan\shader.vert.spv
          if ($LASTEXITCODE -ne 0) { throw "vert failed" }
          & $gl -V native_vulkan\shader.frag -o native_vulkan\shader.frag.spv
          if ($LASTEXITCODE -ne 0) { throw "frag failed" }
          & $gl -V native_vulkan\crt_test.frag -o native_vulkan\crt_test.spv
          if ($LASTEXITCODE -ne 0) { throw "crt_test.frag failed (GLSL 120 -> 450 conversion broken)" }
          Write-Host "crt_test.frag compiled OK"
          Get-ChildItem native_vulkan\*.spv | Select-Object Name, Length

      - name: Compile exe
        shell: pwsh
        run: |
          Copy-Item "assets\preload\images\icons\icon-ultram.png" "native_vulkan\texture.png" -Force
          cl /EHsc /O2 /std:c++17 /I vkh\include /I native_vulkan native_vulkan\main.cpp /link user32.lib gdi32.lib /out:native_vulkan\vulkan_demo.exe
          if ($LASTEXITCODE -ne 0) { throw "cl failed" }
          Get-ChildItem native_vulkan\vulkan_demo.exe, native_vulkan\texture.png | Select-Object Name, Length

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-demo
          path: |
            native_vulkan/vulkan_demo.exe
            native_vulkan/shader.vert.spv
            native_vulkan/shader.frag.spv
            native_vulkan/texture.png
          retention-days: 7
