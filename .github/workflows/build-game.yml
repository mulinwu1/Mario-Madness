name: Build Game Exe

on:
  workflow_dispatch:

# 闇€瑕?actions: read 鎵嶈兘鍦ㄥ悓涓€涓?run 閲屼笅杞藉墠涓€涓?job 鐨?artifact
permissions:
  contents: read
  actions: read

jobs:
  # 鍓嶇疆 job锛氬鐢?build-lime-vulkan.yml 缂栧嚭 Vulkan 鐗?lime.ndll
  # 璇?workflow 鐨?Upload 姝ラ浜у嚭 artifact "lime-vulkan-ndll"锛宺un 鍐呰法 job 鍙
  build-lime-vulkan:
    uses: ./.github/workflows/build-lime-vulkan.yml

  build:
    needs: build-lime-vulkan
    runs-on: windows-latest
    timeout-minutes: 120
    # 宸ュ叿閾剧増鏈繘缂撳瓨 key锛歨axe/lime/hxcpp 浠讳竴鍗囩骇锛屾棫鐨勭紪璇戠紦瀛樹笌 obj 閮戒笉璇ュ鐢?    env:
      HAXE_VERSION: 4.2.5
      LIME_VERSION: 8.0.2
      HXCPP_VERSION: 4.3.2
    steps:
      # 缂栨父鎴忛渶瑕?source/ 鍜?assets/锛屼笉鑳界敤绋€鐤忔鍑?      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # artifact 鏄?run 绾у埆鐨勶紝鍚屼竴涓?run 閲屽墠缃?job 涓婁紶鍚庡彲鐩存帴涓嬭浇
      - name: Download Vulkan lime ndll
        uses: actions/download-artifact@v4
        with:
          name: lime-vulkan-ndll
          path: lime-vulkan-artifact

      - name: Restore haxelib cache
        uses: actions/cache@v4
        with:
          path: ~\haxelib
          key: game-haxelib-${{ runner.os }}-v1
          restore-keys: |
            game-haxelib-

      - name: Install Haxe 4.2.5 and Neko
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path C:\haxe | Out-Null
          New-Item -ItemType Directory -Force -Path C:\neko | Out-Null
          Invoke-WebRequest -Uri "https://github.com/HaxeFoundation/haxe/releases/download/4.2.5/haxe-4.2.5-win64.zip" -OutFile C:\haxe\haxe.zip -UseBasicParsing
          Invoke-WebRequest -Uri "https://github.com/HaxeFoundation/neko/releases/download/v2-3-0/neko-2.3.0-win64.zip" -OutFile C:\neko\neko.zip -UseBasicParsing
          Expand-Archive -Path C:\haxe\haxe.zip -DestinationPath C:\haxe -Force
          Expand-Archive -Path C:\neko\neko.zip -DestinationPath C:\neko -Force
          $haxeDir = (Get-ChildItem C:\haxe -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'haxe.exe') } | Select-Object -First 1).FullName
          $nekoDir = (Get-ChildItem C:\neko -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'neko.exe') } | Select-Object -First 1).FullName
          Add-Content -Path $env:GITHUB_ENV -Value "NEKOPATH=$nekoDir"
          Add-Content -Path $env:GITHUB_ENV -Value "HAXE_STD_PATH=$haxeDir\std"
          Add-Content -Path $env:GITHUB_PATH -Value $haxeDir
          Add-Content -Path $env:GITHUB_PATH -Value $nekoDir
          $env:PATH = "$haxeDir;$nekoDir;$env:PATH"
          haxe -version
          neko -version

      # 鐗堟湰閿佸畾鑷粨搴撴牴鐩綍鐨?complations_preset.bat
      - name: Install haxelibs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path "$env:USERPROFILE\haxelib\hxcpp\.current")) { haxelib install hxcpp 4.3.2 }
          haxelib install lime 8.0.2
          haxelib install openfl 9.2.0
          haxelib install flixel 5.3.1
          haxelib install flixel-addons 3.1.1
          haxelib install flixel-ui 2.5.0
          haxelib install hxCodec 2.6.1
          haxelib install hscript
          haxelib install discord_rpc
          haxelib install linc_luajit
          haxelib install format
          haxelib install hxp
          haxelib list

      # 鎶?artifact 閲岀殑 Vulkan 鐗?lime.ndll 鎹㈣繘 haxelib 瑁呯殑瀹樻柟 lime 8.0.2锛?      # patch_lime.py 鍙姩 C++锛圤penGLBindings.cpp / Build.xml / SDLWindow.cpp锛夛紝
      # Haxe 渚?lime 婧愮爜涓庡畼鏂逛竴鑷达紝鎵€浠ヨ繖閲屼笉闇€瑕?haxelib dev锛屾崲浜岃繘鍒跺嵆鍙?      - name: Wire Vulkan lime ndll into haxelib lime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Resolve-Path "lime-vulkan-artifact\lime.ndll").Path
          $txt = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($src))
          if (([regex]::Matches($txt,'vkCreateInstance')).Count -lt 1) {
            throw "artifact lime-vulkan-ndll is not a Vulkan build (no vkCreateInstance)"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "VULKAN_LIME_NDLL=$src"
          # 缂撳瓨閲岃嫢娈嬬暀 lime dev 鎸囧悜鍒殑 runner 涓婄殑 C:\lime-src锛屼細璁?lime 鐩存帴鎵句笉鍒板簱
          $devFile = "$env:USERPROFILE\haxelib\.dev\lime"
          if (Test-Path $devFile) { Write-Host "removing stale lime dev entry"; Remove-Item $devFile -Force }
          $limeRoot = "$env:USERPROFILE\haxelib\lime\8,0,2"
          if (-not (Test-Path $limeRoot)) { throw "haxelib lime 8.0.2 not found: $limeRoot" }
          New-Item -ItemType Directory -Force -Path "$limeRoot\ndll\Windows64" | Out-Null
          # 瀛樺湪鍑犱釜骞冲彴鐩綍灏辫鐩栧嚑涓紙Windows64 / Windows64-64 绛夛級锛岄伩鍏嶆紡鎺夌湡姝ｈ澶嶅埗杩涜緭鍑虹殑閭ｄ唤
          $targets = @(Get-ChildItem "$limeRoot\ndll" -Recurse -Filter 'lime.ndll' -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
          foreach ($t in $targets) {
            Copy-Item $src $t -Force
            Write-Host "patched: $t"
          }
          $primary = "$limeRoot\ndll\Windows64\lime.ndll"
          Copy-Item $src $primary -Force
          if (-not (Test-Path $primary)) { throw "failed to place $primary" }
          Write-Host "haxelib lime ndll sha256: $((Get-FileHash $primary -Algorithm SHA256).Hash)"
          Write-Host "artifact ndll sha256:     $((Get-FileHash $src -Algorithm SHA256).Hash)"

      # hxcpp 鍙 .hxcpp_config.xml 閲岀殑 <set> 鎴?-D锛圔uildTool 鐢?mDefines 鍒ゆ柇
      # HXCPP_COMPILE_CACHE锛屽厜璁剧幆澧冨彉閲忎笉浼氱敓鏁堬級锛涚嚎绋嬫暟榛樿 getNumberOfProcesses锛?      # 杩欓噷鏄惧紡鍐欐鏂逛究鏃ュ織鏍稿鏄惁鐢ㄦ弧 runner 鐨勬牳鏁?      - name: Configure hxcpp cache and compile threads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cacheDir = Join-Path $env:GITHUB_WORKSPACE 'hxcpp-cache'
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          $threads = [math]::Max([int]$env:NUMBER_OF_PROCESSORS, 2)
          $cfgPath = "$env:USERPROFILE\.hxcpp_config.xml"
          if (-not (Test-Path $cfgPath)) {
            $hxcppDir = Get-ChildItem "$env:USERPROFILE\haxelib\hxcpp" -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^\d' } | Sort-Object Name -Descending | Select-Object -First 1
            $example = if ($hxcppDir) { Join-Path $hxcppDir.FullName 'toolchain\example.hxcpp_config.xml' } else { $null }
            if ($example -and (Test-Path $example)) { Copy-Item $example $cfgPath -Force }
            else { Set-Content -Path $cfgPath -Value '<xml></xml>' -Encoding ASCII }
          }
          $text = Get-Content $cfgPath -Raw
          $sets = @(
            "  <set name=`"HXCPP_COMPILE_CACHE`" value=`"$cacheDir`" />",
            '  <set name="HXCPP_CACHE_MB" value="2048" />',
            "  <set name=`"HXCPP_COMPILE_THREADS`" value=`"$threads`" />"
          ) -join "`n"
          $text = $text -replace '</xml>', ($sets + "`n</xml>")
          Set-Content -Path $cfgPath -Value $text -NoNewline
          Write-Host "hxcpp config: threads=$threads cache=$cacheDir cacheMB=2048"

      # discord_rpc 鐨?native 婧愮爜 haxelib 鍖呴噷缂哄け锛岄渶瑕佹墜宸ヨˉ榻?      - name: Patch discord_rpc native sources
        shell: pwsh
        run: |
          $drRoot = "$env:USERPROFILE\haxelib\discord_rpc"
          $verDir = Get-ChildItem $drRoot -Directory | Where-Object { $_.Name -match '^\d' } | Select-Object -First 1
          if (-not $verDir) { Write-Host "discord_rpc dir missing, skip"; exit 0 }
          $header = Join-Path $verDir.FullName "lib\discord-rpc\include\discord-rpc.h"
          if (-not (Test-Path $header)) {
            $tmp = "C:\discord-rpc-src"
            git clone --depth 1 --branch v2.1.0 --recursive --shallow-submodules https://github.com/discord/discord-rpc.git $tmp
            New-Item -ItemType Directory -Force -Path (Join-Path $verDir.FullName "lib\discord-rpc") | Out-Null
            Copy-Item "$tmp\include" (Join-Path $verDir.FullName "lib\discord-rpc\include") -Recurse -Force
            Copy-Item "$tmp\src" (Join-Path $verDir.FullName "lib\discord-rpc\src") -Recurse -Force
          }
          $inc = Join-Path $verDir.FullName "lib\discord-rpc\include"
          if (Test-Path "$inc\discord_rpc.h") {
            Copy-Item "$inc\discord_rpc.h" "$inc\discord-rpc.h" -Force
          }
          $rj = "C:\rapidjson-src"
          git clone --depth 1 https://github.com/Tencent/rapidjson.git $rj
          New-Item -ItemType Directory -Force -Path (Join-Path $verDir.FullName "lib\discord-rpc\src\rapidjson") | Out-Null
          Copy-Item "$rj\include\rapidjson\*" (Join-Path $verDir.FullName "lib\discord-rpc\src\rapidjson") -Recurse -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $inc "rapidjson") | Out-Null
          Copy-Item "$rj\include\rapidjson\*" (Join-Path $inc "rapidjson") -Recurse -Force

      # hxcpp 缂栬瘧缂撳瓨鏄唴瀹瑰搱甯屽鍧€鐨勶紙HXCPP_COMPILE_CACHE锛夛紝婧愮爜鏀瑰姩鍚庝粛鑳藉鐢ㄦ湭鍙樼殑缂栬瘧鍗曞厓
      - name: Restore hxcpp compile cache
        uses: actions/cache@v4
        with:
          path: hxcpp-cache
          key: hxcpp-cc-${{ runner.os }}-haxe${{ env.HAXE_VERSION }}-lime${{ env.LIME_VERSION }}-hxcpp${{ env.HXCPP_VERSION }}-${{ hashFiles('source/**', 'Project.xml') }}-v3
          restore-keys: |
            hxcpp-cc-${{ runner.os }}-haxe${{ env.HAXE_VERSION }}-lime${{ env.LIME_VERSION }}-hxcpp${{ env.HXCPP_VERSION }}-

      # obj/bin 蹇呴』鐢ㄧ簿纭?key锛歨xcpp 闈?mtime 鍒ゆ柇鏄惁閲嶇紪锛屾嬁鍒鐨?obj 浼氬湪婧愮爜鍙樻洿鏃?      # 闈欓粯浜у嚭閿欒鐨?exe锛屾墍浠ユ簮鐮佸搱甯屼竴鍙樺氨瀹屽叏涓嶅鐢?      - name: Restore build output cache
        uses: actions/cache@v4
        with:
          path: export\release\windows
          key: mario-obj-v3-${{ runner.os }}-haxe${{ env.HAXE_VERSION }}-lime${{ env.LIME_VERSION }}-hxcpp${{ env.HXCPP_VERSION }}-${{ hashFiles('source/**', 'Project.xml') }}

      # hxcpp 鍙粰澹版槑浜?<cache value="true"/> 鐨?file group 鐢ㄧ紪璇戠紦瀛橈紱hxcpp 鑷甫鐨?std 缁勫凡寮€锛?      # 娓告垙鑷繁鐨?app 缁勫湪 lime 鐨?hxcpp 妯℃澘閲屾病寮€ 鈫?琛ヤ笂锛屽惁鍒?HXCPP_COMPILE_CACHE 瀵规父鎴忔簮鐮佸畬鍏ㄦ棤鏁?      - name: Enable hxcpp compile cache for app file groups
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $limeRoot = "$env:USERPROFILE\haxelib\lime\8,0,2"
          if (-not (Test-Path $limeRoot)) { throw "haxelib lime 8.0.2 not found: $limeRoot" }
          $templates = @(Get-ChildItem (Join-Path $limeRoot 'templates') -Recurse -Filter 'Build.xml' -File -ErrorAction SilentlyContinue)
          if ($templates.Count -eq 0) { throw "no hxcpp Build.xml template under $limeRoot\templates" }
          $total = 0
          foreach ($t in $templates) {
            $xml = Get-Content $t.FullName -Raw
            if ([string]::IsNullOrWhiteSpace($xml)) { continue }
            $sb = New-Object System.Text.StringBuilder
            $last = 0
            $hit = 0
            foreach ($m in [regex]::Matches($xml, '<files\s+[^>]*>')) {
              $null = $sb.Append($xml.Substring($last, $m.Index - $last))
              $null = $sb.Append($m.Value)
              $rest = $xml.Substring($m.Index + $m.Length, [math]::Min(200, $xml.Length - ($m.Index + $m.Length)))
              # 缁勯噷棣栧睆宸叉湁 cache 灏变笉閲嶅鎻掞紙hxcpp 鐨?std 缁勬湰鏉ュ氨甯︼級
              if ($rest -notmatch '<cache') {
                $null = $sb.Append("`n      <cache value=`"true`" />")
                $hit++
              }
              $last = $m.Index + $m.Length
            }
            $null = $sb.Append($xml.Substring($last))
            if ($hit -gt 0) {
              [IO.File]::WriteAllText($t.FullName, $sb.ToString())
              $total += $hit
              Write-Host "patched $hit file group(s) in $($t.FullName)"
            }
          }
          if ($total -eq 0) {
            # haxelib 缂撳瓨鍛戒腑鏃舵ā鏉垮彲鑳藉凡琚笂涓€杞ˉ杩囷紝杩欓噷涓嶇畻澶辫触
            Write-Host "all file groups already have <cache>; nothing to patch"
          } else {
            Write-Host "hxcpp compile cache enabled on $total file group(s)"
          }

      - name: Build game
        shell: pwsh
        run: |
          # 婧愮爜锛坰ource/**銆丳roject.xml锛夋病鍙樹笖涓婁竴杞骇鐗╁湪缂撳瓨閲?鈫?鐩存帴澶嶇敤锛?          # 璺宠繃 assets 娓呯┖銆乭axe 璧勬簮瀵煎嚭銆乭xcpp 缂栬瘧涓夊潡锛涜繖鏄浜屾鏋勫缓蹇殑鍏抽敭
          Write-Host "runner cores: $env:NUMBER_OF_PROCESSORS (HXCPP_COMPILE_THREADS set to max(cores,2))"
          Write-Host "hxcpp compile cache dir: $env:GITHUB_WORKSPACE\hxcpp-cache"
          $outDir = "export\release\windows"
          $stamp = Join-Path $outDir '.build-stamp'
          $priorExe = Get-ChildItem $outDir -Recurse -Filter 'Mario.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ((Test-Path $stamp) -and ((Get-Content $stamp -Raw).Trim() -eq $env:GITHUB_SHA) -and $priorExe) {
            Write-Host "=== cache hit: source unchanged (commit $env:GITHUB_SHA) ==="
            "=== cache hit: source unchanged (commit $env:GITHUB_SHA) ===" | Add-Content build.log
            Copy-Item $env:VULKAN_LIME_NDLL (Join-Path $priorExe.Directory.FullName 'lime.ndll') -Force
            Write-Host "reused exe: $($priorExe.FullName) (mtime $($priorExe.LastWriteTime))"
            return
          }
          # 鍐疯矾寰勬墠闇€瑕佹竻绌哄ぇ璧勬簮鐩綍锛歭ime 浼氭妸 assets 鎼繘 bin锛?.8GB 灏忔枃浠跺湪 runner 涓婃瀬鎱?          Get-ChildItem 'assets' -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $mb = [math]::Round(((Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum) / 1MB, 1)
            Write-Host "$($_.Name) = ${mb}MB -> emptied"
            Get-ChildItem $_.FullName -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }
          $hx = (Get-Command haxelib).Source
          Remove-Item build.log, build.err, empty.stdin -ErrorAction SilentlyContinue
          New-Item -ItemType File -Path empty.stdin | Out-Null
          Write-Host "haxelib: $hx"
          Write-Host "Project.xml exists: $(Test-Path Project.xml)"
          Write-Host "lime run.n exists: $(Test-Path "$env:USERPROFILE\haxelib\lime\8,0,2\run.n")"
          Write-Host "export dir exists: $(Test-Path export)"
          Write-Host "haxelib list:"
          haxelib list
          $buildStart = Get-Date
          # 鍏抽敭锛欳I 娌℃湁缁堢锛屼换浣?readLine() 閮戒細姘镐箙鎸傝捣銆傜敤绌烘枃浠朵綔涓?stdin 绔嬪嵆杩斿洖 EOF
          $p = Start-Process -FilePath $hx -ArgumentList "run","lime","build","windows" `
               -NoNewWindow -RedirectStandardOutput build.log -RedirectStandardError build.err `
               -RedirectStandardInput empty.stdin -PassThru
          $deadline = (Get-Date).AddMinutes(40)
          while (-not $p.HasExited) {
            if ((Get-Date) -gt $deadline) {
              Write-Host "=== TIMEOUT 40min, killing pid $($p.Id) ==="
              Stop-Process -Id $p.Id -Force
              break
            }
            $tail = Get-Content build.log -Tail 6 -ErrorAction SilentlyContinue
            if ($tail) { $tail | ForEach-Object { Write-Host "  out| $_" } }
            $err = Get-Content build.err -Tail 3 -ErrorAction SilentlyContinue
            if ($err) { $err | ForEach-Object { Write-Host "  err| $_" } }
            Write-Host "  ---- alive, log lines=$((Get-Content build.log -ErrorAction SilentlyContinue | Measure-Object).Count) ----"
            Start-Sleep 15
          }
          $code = $p.ExitCode
          Write-Host "exit code: $code"
          # 姝ラ success 鈮?缂栬瘧 success锛氫箣鍓嶆病妫€鏌ラ€€鍑虹爜锛宭ime 澶辫触浣嗚剼鏈甯哥粨鏉燂紝
          # Actions 浠嶆樉绀虹豢鑹诧紝鐧借窇浜嗗ソ鍑犺疆銆傝繖閲屽繀椤绘樉寮忓け璐ャ€?          if ($code -ne 0) {
            Write-Host "=== build.log (tail 40) ==="
            Get-Content build.log -Tail 40 -ErrorAction SilentlyContinue
            Write-Host "=== build.err (tail 40) ==="
            Get-Content build.err -Tail 40 -ErrorAction SilentlyContinue
            throw "lime build failed, exit code $code"
          }
          # lime 鎶?ndll 鏀惧埌 applicationDirectory锛坵indows 鐩爣鏄?<target>\bin锛夛紝
          # 鐩存帴璐寸潃 exe 鏀撅紝淇濊瘉杩愯鐨勫氨鏄?Vulkan 鐗堬紱鍚屾椂鍐?build-stamp 渚涗笅娆″懡涓紦瀛?          $builtExe = Get-ChildItem $outDir -Recurse -Filter 'Mario.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $builtExe) { throw "no Mario.exe produced under $outDir" }
          Copy-Item $env:VULKAN_LIME_NDLL (Join-Path $builtExe.Directory.FullName 'lime.ndll') -Force
          Set-Content -Path $stamp -Value $env:GITHUB_SHA -NoNewline
          # 璇佹嵁锛歭ime 鐢熸垚鐨?Build.xml 閲岀‘瀹炲甫涓婁簡 cache 鏍囪
          $genXml = Get-ChildItem $outDir -Recurse -Filter 'Build.xml' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($genXml) {
            $g = Get-Content $genXml.FullName -Raw
            Write-Host "generated $($genXml.FullName): <cache> tags=$(([regex]::Matches($g,'<cache')).Count)"
          } else {
            Write-Host "WARN: no generated Build.xml found under $outDir"
          }
          Write-Host "=== output tree ==="
          Get-ChildItem $outDir -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table -AutoSize
          Write-Host "=== all exe/ndll under export ==="
          Get-ChildItem 'export' -Recurse -Include *.exe, *.ndll -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
          # 缂撳瓨閲岀殑鏃?exe 浼氱户缁埗閫犫€滄瀯寤烘垚鍔熲€濈殑鍋囪薄锛岃繖閲岀‘璁よ繖娆＄湡鐨勯噸鏂伴摼鎺ヨ繃
          $exe = Get-ChildItem $outDir -Recurse -Filter 'Mario.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Mario.exe not found under $outDir" }
          Write-Host "exe: $($exe.FullName) size=$($exe.Length) mtime=$($exe.LastWriteTime)"
          if ($exe.LastWriteTime -lt $buildStart) {
            throw "Mario.exe was not rebuilt this run (stale from cache): $($exe.FullName)"
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            build.err
          if-no-files-found: warn
          retention-days: 7

      # 鎽婂钩鍒颁竴涓洰褰曞啀涓婁紶锛歛rtifact 瑙ｅ帇鍑烘潵灏辨槸 exe + ndll + dll锛屼笉鐢ㄥ啀鐚滃眰绾?      - name: Assemble package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item pkg -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          $exe = Get-ChildItem 'export\release\windows' -Recurse -Filter 'Mario.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Mario.exe missing" }
          $ndll = Join-Path $exe.Directory.FullName 'lime.ndll'
          if (-not (Test-Path $ndll)) { throw "lime.ndll not found next to exe" }
          Copy-Item $exe.FullName pkg
          Copy-Item $ndll pkg
          Get-ChildItem $exe.Directory -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.dll', '.ico' } | ForEach-Object { Copy-Item $_.FullName pkg -Force }
          Get-ChildItem pkg | Select-Object Name, Length | Format-Table -AutoSize

      # 浜х墿瑕佹槸銆岃兘鐩存帴璺戙€嶇殑涓€鍖咃細exe + Vulkan 鐗?lime.ndll + lime 甯﹀嚭鏉ョ殑杩愯鏃?dll
      # assets/ 鍦?CI 閲岃娓呯┖锛?.75GB锛夛紝杩愯鏃堕潬鏈湴鍩虹鐩綍琛ワ紝鎷艰鐢?tools/deploy_vk_test.ps1 瀹屾垚
      - name: Write run notes
        shell: pwsh
        run: |
          $lines = @(
            "Mario Madness - Vulkan lime (native) package",
            "",
            "[contents]",
            "  Mario.exe              game exe built by this run",
            "  lime.ndll              Vulkan native lime (built by build-lime-vulkan job)",
            "  *.dll / icon.ico       runtime deps copied by lime, if any",
            "  RUNNING.txt            this file",
            "",
            "[not included]",
            "  assets/ mods/ manifest/ libvlc*.dll  (~1.75GB, emptied in CI to keep the build fast)",
            "",
            "[local deploy]",
            "  powershell -ExecutionPolicy Bypass -File tools\deploy_vk_test.ps1",
            "  Downloads the newest mario-vulkan-win64*.zip found in your Downloads folder,",
            "  extracts it into vk_test\, and fills assets from the local game folder.",
            "  Override with -ArtifactZip <path> / -TestDir <path> / -BaseDir <path>.",
            "",
            "[run]",
            "  vk_test\Mario.exe   (or vk_test\launch-vk.bat, which also captures logs)",
            "",
            "[logs]",
            "  vk_test\vk_stdout.log",
            "  vk_test\vk_stderr.log"
          )
          Set-Content -Path pkg\RUNNING.txt -Value $lines -Encoding UTF8

      - name: Upload runnable package
        uses: actions/upload-artifact@v4
        with:
          name: mario-vulkan-win64
          path: pkg/*
          if-no-files-found: error
          retention-days: 7
