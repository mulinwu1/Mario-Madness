name: Build Game Exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      # 编游戏需要 source/ 和 assets/，不能用稀疏检出
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore haxelib cache
        uses: actions/cache@v4
        with:
          path: ~\haxelib
          key: game-haxelib-${{ runner.os }}-v1
          restore-keys: |
            game-haxelib-

      - name: Install Haxe 4.2.5 and Neko
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path C:\haxe | Out-Null
          New-Item -ItemType Directory -Force -Path C:\neko | Out-Null
          Invoke-WebRequest -Uri "https://github.com/HaxeFoundation/haxe/releases/download/4.2.5/haxe-4.2.5-win64.zip" -OutFile C:\haxe\haxe.zip -UseBasicParsing
          Invoke-WebRequest -Uri "https://github.com/HaxeFoundation/neko/releases/download/v2-3-0/neko-2.3.0-win64.zip" -OutFile C:\neko\neko.zip -UseBasicParsing
          Expand-Archive -Path C:\haxe\haxe.zip -DestinationPath C:\haxe -Force
          Expand-Archive -Path C:\neko\neko.zip -DestinationPath C:\neko -Force
          $haxeDir = (Get-ChildItem C:\haxe -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'haxe.exe') } | Select-Object -First 1).FullName
          $nekoDir = (Get-ChildItem C:\neko -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'neko.exe') } | Select-Object -First 1).FullName
          Add-Content -Path $env:GITHUB_ENV -Value "NEKOPATH=$nekoDir"
          Add-Content -Path $env:GITHUB_ENV -Value "HAXE_STD_PATH=$haxeDir\std"
          Add-Content -Path $env:GITHUB_PATH -Value $haxeDir
          Add-Content -Path $env:GITHUB_PATH -Value $nekoDir
          $env:PATH = "$haxeDir;$nekoDir;$env:PATH"
          haxe -version
          neko -version

      # 版本锁定自仓库根目录的 complations_preset.bat
      - name: Install haxelibs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path "$env:USERPROFILE\haxelib\hxcpp\.current")) { haxelib install hxcpp 4.3.2 }
          haxelib install lime 8.0.2
          haxelib install openfl 9.2.0
          haxelib install flixel 5.3.1
          haxelib install flixel-addons 3.1.1
          haxelib install flixel-ui 2.5.0
          haxelib install hxCodec 2.6.1
          haxelib install hscript
          haxelib install discord_rpc
          haxelib install linc_luajit
          haxelib install format
          haxelib install hxp
          haxelib list

      # discord_rpc 的 native 源码 haxelib 包里缺失，需要手工补齐
      - name: Patch discord_rpc native sources
        shell: pwsh
        run: |
          $drRoot = "$env:USERPROFILE\haxelib\discord_rpc"
          $verDir = Get-ChildItem $drRoot -Directory | Where-Object { $_.Name -match '^\d' } | Select-Object -First 1
          if (-not $verDir) { Write-Host "discord_rpc dir missing, skip"; exit 0 }
          $header = Join-Path $verDir.FullName "lib\discord-rpc\include\discord-rpc.h"
          if (-not (Test-Path $header)) {
            $tmp = "C:\discord-rpc-src"
            git clone --depth 1 --branch v2.1.0 --recursive --shallow-submodules https://github.com/discord/discord-rpc.git $tmp
            New-Item -ItemType Directory -Force -Path (Join-Path $verDir.FullName "lib\discord-rpc") | Out-Null
            Copy-Item "$tmp\include" (Join-Path $verDir.FullName "lib\discord-rpc\include") -Recurse -Force
            Copy-Item "$tmp\src" (Join-Path $verDir.FullName "lib\discord-rpc\src") -Recurse -Force
          }
          $inc = Join-Path $verDir.FullName "lib\discord-rpc\include"
          if (Test-Path "$inc\discord_rpc.h") {
            Copy-Item "$inc\discord_rpc.h" "$inc\discord-rpc.h" -Force
          }
          $rj = "C:\rapidjson-src"
          git clone --depth 1 https://github.com/Tencent/rapidjson.git $rj
          New-Item -ItemType Directory -Force -Path (Join-Path $verDir.FullName "lib\discord-rpc\src\rapidjson") | Out-Null
          Copy-Item "$rj\include\rapidjson\*" (Join-Path $verDir.FullName "lib\discord-rpc\src\rapidjson") -Recurse -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $inc "rapidjson") | Out-Null
          Copy-Item "$rj\include\rapidjson\*" (Join-Path $inc "rapidjson") -Recurse -Force

      # 只产出 exe，本地已有完整 assets。
      # 清空大资源目录，避免 lime 在 Windows runner 上搬运 1.8GB 小文件（这是卡住的根因）
      - name: Trim heavy assets
        shell: pwsh
        run: |
          foreach ($d in @('assets\songs', 'assets\shared', 'assets\videos')) {
            if (Test-Path $d) {
              $mb = [math]::Round(((Get-ChildItem $d -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum) / 1MB, 1)
              Write-Host "$d = ${mb}MB -> emptied"
              Remove-Item $d -Recurse -Force -ErrorAction SilentlyContinue
            }
            New-Item -ItemType Directory -Force -Path $d | Out-Null
          }

      # 把 lime 输出重定向到文件并轮询打印，这样 Actions 页面能看到实时进度
      # 之前完全看不到输出，无法判断是在编译还是卡在网络请求
      - name: Build game
        shell: pwsh
        run: |
          $hx = (Get-Command haxelib).Source
          Remove-Item build.log, build.err, empty.stdin -ErrorAction SilentlyContinue
          New-Item -ItemType File -Path empty.stdin | Out-Null
          Write-Host "haxelib: $hx"
          Write-Host "Project.xml exists: $(Test-Path Project.xml)"
          Write-Host "lime run.n exists: $(Test-Path "$env:USERPROFILE\haxelib\lime\8,0,2\run.n")"
          Write-Host "export dir exists: $(Test-Path export)"
          Write-Host "haxelib list:"
          haxelib list
          # 关键：CI 没有终端，任何 readLine() 都会永久挂起。用空文件作为 stdin 立即返回 EOF
          $p = Start-Process -FilePath $hx -ArgumentList "run","lime","build","windows" `
               -NoNewWindow -RedirectStandardOutput build.log -RedirectStandardError build.err `
               -RedirectStandardInput empty.stdin -PassThru
          $deadline = (Get-Date).AddMinutes(40)
          while (-not $p.HasExited) {
            if ((Get-Date) -gt $deadline) {
              Write-Host "=== TIMEOUT 40min, killing pid $($p.Id) ==="
              Stop-Process -Id $p.Id -Force
              break
            }
            $tail = Get-Content build.log -Tail 6 -ErrorAction SilentlyContinue
            if ($tail) { $tail | ForEach-Object { Write-Host "  out| $_" } }
            $err = Get-Content build.err -Tail 3 -ErrorAction SilentlyContinue
            if ($err) { $err | ForEach-Object { Write-Host "  err| $_" } }
            Write-Host "  ---- alive, log lines=$((Get-Content build.log -ErrorAction SilentlyContinue | Measure-Object).Count) ----"
            Start-Sleep 15
          }
          Write-Host "exit code: $($p.ExitCode)"
          $outDir = "export\release\windows"
          Get-ChildItem $outDir -ErrorAction SilentlyContinue | Select-Object Name, Length

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            build.err
          if-no-files-found: warn
          retention-days: 7

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: mario-exe-fixed-shaders
          path: |
            export/release/windows/Mario.exe
            export/release/windows/*.ndll
          if-no-files-found: warn
          retention-days: 7
