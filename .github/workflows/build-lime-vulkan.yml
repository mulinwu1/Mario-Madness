name: Build Lime Vulkan Native

# workflow_call：由 build-game.yml 作为前置 job 复用，产出的 artifact 在同一次 run 内
# 直接给游戏构建 job 下载，不需要跨 run / release 传文件
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # 仓库有 1.8GB(assets)，编 lime 只需要 native_vulkan/，稀疏检出省掉 checkout 的大头
      # 它只影响 runner 上落地哪些文件，与 actions/cache 的三条缓存路径无关
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            native_vulkan
          sparse-checkout-cone-mode: false

      # key 必须跟着源码走：只用常量 key 会把上一轮的东西一直带过来
      - name: Compute source hash
        id: srchash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem native_vulkan -File -Recurse |
            Where-Object { $_.Extension -in '.cpp', '.h', '.py', '.yml' } | Sort-Object FullName
          $lines = foreach ($f in $files) { "$($f.FullName)|$((Get-FileHash $f.FullName -Algorithm SHA256).Hash)" }
          $ms = [IO.MemoryStream]::new([Text.Encoding]::UTF8.GetBytes(($lines -join "`n")))
          $hash = (Get-FileHash -InputStream $ms -Algorithm SHA256).Hash.Substring(0, 16)
          Write-Host "source hash: $hash ($($files.Count) files)"
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # 只缓存"下载物"（haxelib、Vulkan 头、glslang 官方包），不缓存任何构建树：
      # lime-src 整目录缓存会带 obj/ndll，造出"旧产物 + 新 mtime"的假成功，
      # 断言只能挡住 ndll，挡不住 obj。宁可每轮全量重编。
      - name: Restore build caches
        uses: actions/cache@v6
        with:
          path: |
            ~\haxelib
            vkh
            C:\glslang\include
            C:\glslang\lib
          key: lime-vk-v4-${{ runner.os }}-${{ steps.srchash.outputs.hash }}
          restore-keys: |
            lime-vk-v4-${{ runner.os }}-
            lime-vk-v4-
            lime-vk-v2-

      - name: Install Haxe 4.2.5 and Neko
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path C:\haxe | Out-Null
          New-Item -ItemType Directory -Force -Path C:\neko | Out-Null
          if (-not (Test-Path C:\haxe\haxe.zip)) {
            Invoke-WebRequest -Uri "https://github.com/HaxeFoundation/haxe/releases/download/4.2.5/haxe-4.2.5-win64.zip" -OutFile C:\haxe\haxe.zip -UseBasicParsing
          }
          if (-not (Test-Path C:\neko\neko.zip)) {
            Invoke-WebRequest -Uri "https://github.com/HaxeFoundation/neko/releases/download/v2-3-0/neko-2.3.0-win64.zip" -OutFile C:\neko\neko.zip -UseBasicParsing
          }
          $haxeDir = (Get-ChildItem C:\haxe -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'haxe.exe') } | Select-Object -First 1).FullName
          if (-not $haxeDir) { Expand-Archive -Path C:\haxe\haxe.zip -DestinationPath C:\haxe -Force }
          $nekoDir = (Get-ChildItem C:\neko -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'neko.exe') } | Select-Object -First 1).FullName
          if (-not $nekoDir) { Expand-Archive -Path C:\neko\neko.zip -DestinationPath C:\neko -Force }
          $haxeDir = (Get-ChildItem C:\haxe -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'haxe.exe') } | Select-Object -First 1).FullName
          $nekoDir = (Get-ChildItem C:\neko -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'neko.exe') } | Select-Object -First 1).FullName
          Add-Content -Path $env:GITHUB_ENV -Value "NEKOPATH=$nekoDir"
          Add-Content -Path $env:GITHUB_ENV -Value "HAXE_STD_PATH=$haxeDir\std"
          Add-Content -Path $env:GITHUB_PATH -Value $haxeDir
          Add-Content -Path $env:GITHUB_PATH -Value $nekoDir
          $env:PATH = "$haxeDir;$nekoDir;$env:PATH"
          $env:NEKOPATH = $nekoDir
          $env:HAXE_STD_PATH = "$haxeDir\std"
          haxe -version
          neko -version
          Write-Host "haxelib repo: $(haxelib config)"

      - name: Install haxelibs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "haxelib repo: $(haxelib config)"
          if (-not (Test-Path "$env:USERPROFILE\haxelib\hxcpp\.current")) { haxelib install hxcpp 4.3.2 }
          else { Write-Host "hxcpp cached" }
          if (-not (Test-Path "$env:USERPROFILE\haxelib\format\.current")) { haxelib install format }
          else { Write-Host "format cached" }
          if (-not (Test-Path "$env:USERPROFILE\haxelib\hxp\.current")) { haxelib install hxp }
          else { Write-Host "hxp cached" }
          haxelib list

      - name: Fetch Vulkan Headers
        shell: pwsh
        run: |
          if (-not (Test-Path "vkh\include\vulkan\vulkan.h")) {
            git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git vkh
          } else {
            Write-Host "Vulkan-Headers cached"
          }
          Test-Path vkh\include\vulkan\vulkan.h

      # glslang 16.6.0 官方 Windows 静态库是 /MD 构建，直接链接进 hxcpp 的 /MT ndll 会
      # 报 LNK2038 RuntimeLibrary 不匹配。所以这里把官方库包成一个独立 DLL
      # (lime_glslang.dll)，ndll 侧只链它的 import lib，两边 CRT 互不干扰。
      # 我们自己的产物一律落 C:\glslang\out，与缓存的 include/lib（官方包）分开，
      # 这样缓存里不会混进任何 .dll/.lib/.obj 产物。
      - name: Fetch glslang 16.6.0 and build lime_glslang.dll
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'C:\glslang\glslang166.zip'
          $hdr = 'C:\glslang\include\glslang\Include\glslang_c_interface.h'
          if (-not (Test-Path $hdr)) {
            New-Item -ItemType Directory -Force -Path C:\glslang | Out-Null
            Invoke-WebRequest -Uri "https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-windows-x86_64-release.zip" -OutFile $zip -UseBasicParsing
            Expand-Archive -Path $zip -DestinationPath C:\glslang -Force
          } else {
            Write-Host "glslang 16.6.0 cached"
          }
          foreach ($l in @('glslang.lib','glslang-default-resource-limits.lib','SPIRV-Tools.lib','SPIRV-Tools-opt.lib')) {
            if (-not (Test-Path "C:\glslang\lib\$l")) { throw "glslang package missing $l" }
          }
          Write-Host "glslang.lib bytes: $((Get-Item 'C:\glslang\lib\glslang.lib').Length)"

          New-Item -ItemType Directory -Force -Path C:\glslang\out | Out-Null
          $out = 'C:\glslang\out'
          if (-not (Test-Path "$out\lime_glslang.dll")) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
            $log = 'C:\glslang\shim_build.log'
            cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul 2>&1 && cl /nologo /c /MD /O2 native_vulkan\glslang_shim.cpp /Fo:$out\glslang_shim.obj && link /nologo /DLL /out:$out\lime_glslang.dll /implib:$out\lime_glslang.lib /def:native_vulkan\glslang_shim.def $out\glslang_shim.obj C:\glslang\lib\glslang.lib C:\glslang\lib\glslang-default-resource-limits.lib C:\glslang\lib\SPIRV-Tools.lib C:\glslang\lib\SPIRV-Tools-opt.lib > $log 2>&1"
            if ($LASTEXITCODE -ne 0) {
              Get-Content $log
              throw "lime_glslang.dll build failed ($LASTEXITCODE)"
            }
            Write-Host "lime_glslang.dll built"
          } else {
            Write-Host "lime_glslang.dll cached"
          }
          Get-Item C:\glslang\out\lime_glslang.dll, C:\glslang\out\lime_glslang.lib | Select-Object FullName, Length

      - name: Prepare lime source and inject vulkan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # lime-src 不进缓存：树里只要带上一轮的 obj/ndll，就可能出现"旧产物 + 新 mtime"
          # 的假成功。固定从干净 clone 开始，全量重编（几十秒），换掉这一类误判。
          if (Test-Path 'C:\lime-src') { Remove-Item 'C:\lime-src' -Recurse -Force }
          git clone --depth 1 --branch 8.0.2 --recursive --shallow-submodules https://github.com/openfl/lime.git C:\lime-src
          New-Item -ItemType Directory -Force -Path C:\lime-src\project\src\graphics\vulkan | Out-Null
          # 拷贝清单必须覆盖 patch_lime.py 的全部 sources（含平台文件与新增的 packet 源），
          # 少一个会在准备阶段的 assert_sources_present() 直接 exit 1
          # 动态取 native_vulkan 下全部 .h/.cpp（排除 standalone 的 main/demo/stubs）：
          # 不再手写清单，避免“改了实现没同步头”导致 not a member of / undeclared identifier
          $files = @(Get-ChildItem native_vulkan -File | Where-Object {
            $_.Extension -in '.h', '.cpp' -and $_.Name -notin @('main.cpp', 'demo_renderer.cpp', 'gl_stubs.cpp')
          } | Select-Object -ExpandProperty Name | Sort-Object)
          Write-Host ("copying {0} native files into lime-src: {1}" -f $files.Count, ($files -join ', '))
          Copy-Item -Path ($files | ForEach-Object { "native_vulkan\$_" }) -Destination C:\lime-src\project\src\graphics\vulkan\ -Force
          # vulkan_core.h 会引用 vk_video/ 下的视频编码头，两个目录都要复制
          Copy-Item vkh\include\vulkan C:\lime-src\project\include\ -Recurse -Force
          Copy-Item vkh\include\vk_video C:\lime-src\project\include\ -Recurse -Force
          # hxcpp 编译只认 lime 自己的 -Iinclude，glslang 头也照同样方式落进去
          Copy-Item C:\glslang\include\glslang C:\lime-src\project\include\ -Recurse -Force
          $env:LIME_SRC = "C:\lime-src"
          # 平台判定钉死：主线已改为显式变量最高优先，不再读 runner 自带的 NDK 变量
          $env:LIME_PLATFORM = 'windows'
          $plog = Join-Path $env:GITHUB_WORKSPACE 'prepare-lime.log'
          python native_vulkan\patch_lime.py 2>&1 | Tee-Object -FilePath $plog -Append
          $code = $LASTEXITCODE
          Write-Host "patch_lime exit=$code"
          "patch_lime exit=$code" | Out-File $plog -Append
          if ($code -ne 0) { Write-Host "prepare failed"; exit 1 }
          haxelib dev lime C:\lime-src
          Get-ChildItem C:\lime-src\project\src\graphics\vulkan | Select-Object Name, Length

      - name: Build lime native
        shell: pwsh
        run: |
          $ndll = "C:\lime-src\ndll\Windows64\lime.ndll"
          $log = Join-Path $env:GITHUB_WORKSPACE 'build-lime.log'
          $started = Get-Date
          "build_started: $($started.ToString('o'))" | Out-File $log
          # 兜底：即便以后有人把 lime-src 加回缓存，这一步也保证不用旧 ndll
          if (Test-Path $ndll) {
            Remove-Item $ndll -Force
            "removed stale ndll: $ndll" | Out-File $log -Append
          }
          # 链接契约：gl_shader.cpp:22 用 #pragma comment 硬编码了
          #   C:\glslang\lib\lime_glslang.lib
          # 而 shim 产物落 C:\glslang\out（刻意不进缓存）。rebuild 前补一份到 pragma 路径，
          # 末尾 Drop build artifacts 会再删掉，避免被 post-job cache save 收进去。
          $implib = 'C:\glslang\out\lime_glslang.lib'
          if (-not (Test-Path $implib)) {
            Write-Host "ASSERT FAIL: missing $implib"
            Get-ChildItem C:\glslang\out -ErrorAction SilentlyContinue | Select-Object Name, Length
            "ASSERT FAIL: missing $implib" | Out-File $log -Append
            exit 1
          }
          Copy-Item $implib 'C:\glslang\lib\lime_glslang.lib' -Force
          "copied implib -> C:\glslang\lib\lime_glslang.lib ($((Get-Item $implib).Length) B)" | Out-File $log -Append
          Push-Location C:\lime-src
          # 只出 x64：glslang 官方包只有 x86_64 库，32 位 ndll 链接会 LNK4272；
          # 游戏本身跑 Windows64，不需要 Windows/lime.ndll
          haxelib run lime rebuild windows -64 2>&1 | Tee-Object -FilePath $log -Append
          $code = $LASTEXITCODE
          Pop-Location
          Write-Host "lime rebuild exit=$code"
          "lime rebuild exit=$code" | Out-File $log -Append
          if ($code -ne 0) { Write-Host "build failed"; exit 1 }
          if (Test-Path $ndll) {
            $info = Get-Item $ndll
            $info | Select-Object FullName, Length
            $info | ForEach-Object { "ndll: $($_.FullName) $($_.Length) B  LastWriteTime=$($_.LastWriteTime.ToString('o'))" } | Out-File $log -Append
            # 必须是本轮生成的：比构建开始时间新，否则就是上一次留下的旧文件
            if ($info.LastWriteTime -le $started) {
              Write-Host "ndll is stale (older than build start): $($info.LastWriteTime)"
              "ASSERT FAIL: ndll stale" | Out-File $log -Append
              exit 1
            }
            $bytes = [IO.File]::ReadAllBytes($ndll)
            $txt = [Text.Encoding]::ASCII.GetString($bytes)
            $vkCount = ([regex]::Matches($txt,'vkCreateInstance')).Count
            Write-Host "vkCreateInstance occurrences: $vkCount"
            $shimCount = ([regex]::Matches($txt,'lime_glslang.dll')).Count
            Write-Host "lime_glslang.dll imports: $shimCount"
            Write-Host "sha256: $((Get-FileHash $ndll -Algorithm SHA256).Hash)"
            "size=$($info.Length) sha256=$((Get-FileHash $ndll -Algorithm SHA256).Hash)" | Out-File $log -Append
            # 供 build-game.yml 侧核对 artifact 确实是 Vulkan 版
            if ($vkCount -lt 1) { Write-Host "not a vulkan ndll"; exit 1 }
            # 没有这条 import 说明 gl_shader.cpp 没进链接，shader 还是 lime 的 no-op
            if ($shimCount -lt 1) { Write-Host "gl_shader not linked (no lime_glslang.dll import)"; exit 1 }
          } else {
            Write-Host "lime.ndll NOT produced"
            "ASSERT FAIL: ndll not produced" | Out-File $log -Append
            exit 1
          }

      # 失败时也要有日志可查：与产物上传分开，always()
      # 准备阶段（patch_lime / assert_sources_present）失败也有 prepare-lime.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lime-vulkan-build-log
          path: |
            build-lime.log
            prepare-lime.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: lime-vulkan-ndll
          path: |
            C:\lime-src\ndll\Windows64\lime.ndll
            C:\glslang\out\lime_glslang.dll
          retention-days: 7

      # 缓存路径已不含 lime-src / glslang\out；这步是兜底，确保任何残留产物都不会被
      # post-job 的 cache save 收进去（含失败轮）
      - name: Drop build artifacts before cache save
        if: always()
        shell: pwsh
        run: |
          foreach ($p in @('C:\lime-src\ndll\Windows64\lime.ndll', 'C:\glslang\lib\lime_glslang.lib', 'C:\glslang\out\lime_glslang.dll', 'C:\glslang\out\lime_glslang.lib', 'C:\glslang\out\glslang_shim.obj')) {
            if (Test-Path $p) { Remove-Item $p -Force; Write-Host "removed $p" }
          }
