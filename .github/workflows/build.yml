name: Build ANGLE Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Haxe 4.2.5 and Neko
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path C:\haxe | Out-Null
          New-Item -ItemType Directory -Force -Path C:\neko | Out-Null
          Invoke-WebRequest -Uri "https://github.com/HaxeFoundation/haxe/releases/download/4.2.5/haxe-4.2.5-win64.zip" -OutFile C:\haxe\haxe.zip -UseBasicParsing
          Expand-Archive -Path C:\haxe\haxe.zip -DestinationPath C:\haxe -Force
          Invoke-WebRequest -Uri "https://github.com/HaxeFoundation/neko/releases/download/v2-3-0/neko-2.3.0-win64.zip" -OutFile C:\neko\neko.zip -UseBasicParsing
          Expand-Archive -Path C:\neko\neko.zip -DestinationPath C:\neko -Force

          $haxeDir = (Get-ChildItem C:\haxe -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'haxe.exe') } | Select-Object -First 1).FullName
          $nekoDir = (Get-ChildItem C:\neko -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'neko.exe') } | Select-Object -First 1).FullName
          Write-Host "HAXE DIR: $haxeDir"
          Write-Host "NEKO DIR: $nekoDir"
          Test-Path (Join-Path $nekoDir 'std.ndll')

          Add-Content -Path $env:GITHUB_ENV -Value "NEKOPATH=$nekoDir"
          Add-Content -Path $env:GITHUB_ENV -Value "HAXE_STD_PATH=$haxeDir\std"
          Add-Content -Path $env:GITHUB_PATH -Value $haxeDir
          Add-Content -Path $env:GITHUB_PATH -Value $nekoDir

          $env:PATH = "$haxeDir;$nekoDir;$env:PATH"
          $env:NEKOPATH = $nekoDir
          $env:HAXE_STD_PATH = "$haxeDir\std"

          haxe -version
          neko -version
          haxelib version

      - name: Install haxelibs
        shell: pwsh
        run: |
          haxelib install hxcpp 4.3.2
          haxelib install lime 8.0.2
          haxelib install openfl 9.2.0
          haxelib install flixel 5.3.1
          haxelib install flixel-addons 3.1.1
          haxelib install flixel-ui 2.5.0
          haxelib install hxCodec 2.6.1
          haxelib install hscript
          haxelib install discord_rpc
          haxelib install linc_luajit
          haxelib list
          Write-Host "--- lime native project check ---"
          $limeRoot = "$env:USERPROFILE\haxelib\lime\8,0,2"
          Test-Path "$limeRoot\project\Build.xml"
          Get-ChildItem "$limeRoot\ndll" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length, LastWriteTime

      - name: Patch discord_rpc native sources
        shell: pwsh
        run: |
          $drRoot = "$env:USERPROFILE\haxelib\discord_rpc\1,0,0"
          Write-Host "--- discord_rpc tree ---"
          Get-ChildItem $drRoot -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object FullName
          $header = Join-Path $drRoot "lib\discord-rpc\include\discord-rpc.h"
          if (-not (Test-Path $header)) {
            Write-Host "discord-rpc native lib missing, cloning..."
            $tmp = "C:\discord-rpc-src"
            git clone --depth 1 --recursive --shallow-submodules https://github.com/discord/discord-rpc.git $tmp
            New-Item -ItemType Directory -Force -Path (Join-Path $drRoot "lib\discord-rpc") | Out-Null
            Copy-Item "$tmp\include" (Join-Path $drRoot "lib\discord-rpc\include") -Recurse -Force
            Copy-Item "$tmp\src" (Join-Path $drRoot "lib\discord-rpc\src") -Recurse -Force
          }
          $inc = Join-Path $drRoot "lib\discord-rpc\include"
          Get-ChildItem $inc -ErrorAction SilentlyContinue | Select-Object Name
          if (Test-Path "$inc\discord_rpc.h") {
            Copy-Item "$inc\discord_rpc.h" "$inc\discord-rpc.h" -Force
            Write-Host "created discord-rpc.h alias"
          }
          Test-Path $header
          Get-ChildItem (Join-Path $drRoot "lib\discord-rpc") -Depth 2 -ErrorAction SilentlyContinue | Select-Object Name

      - name: Rebuild lime native with ANGLE (hxcpp direct)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 --branch 8.0.2 --recursive --shallow-submodules https://github.com/openfl/lime.git C:\lime-src
          Write-Host "--- lime source tree (project) ---"
          Get-ChildItem C:\lime-src\project -ErrorAction SilentlyContinue | Select-Object Name
          Get-ChildItem C:\lime-src\project\lib -ErrorAction SilentlyContinue | Select-Object Name
          Push-Location C:\lime-src\project
          haxelib run hxcpp Build.xml windows -Dangle
          $code = $LASTEXITCODE
          Pop-Location
          Write-Host "hxcpp exit=$code"
          $ndll = "C:\lime-src\ndll\Windows64\lime.ndll"
          if (Test-Path $ndll) {
            Get-Item $ndll | Select-Object FullName, Length, LastWriteTime
            $bytes = [IO.File]::ReadAllBytes($ndll)
            $txt = [Text.Encoding]::ASCII.GetString($bytes)
            Write-Host "ANGLE check - libEGL.dll occurrences: $(([regex]::Matches($txt,'libEGL.dll')).Count)"
            Write-Host "ANGLE check - eglCreateContext occurrences: $(([regex]::Matches($txt,'eglCreateContext')).Count)"
            Copy-Item $ndll "$env:USERPROFILE\haxelib\lime\8,0,2\ndll\Windows64\lime.ndll" -Force
            Write-Host "copied to haxelib lime ndll"
          } else {
            Write-Host "lime.ndll NOT produced"
          }

      - name: Build game with ANGLE
        shell: pwsh
        run: |
          haxelib run lime build windows -Dangle
          Write-Host "exit=$LASTEXITCODE"
          Get-ChildItem export\windows -ErrorAction SilentlyContinue | Select-Object Name, Length
          $angleDir = "C:\lime-src\dependencies\angle"
          Write-Host "angle dir: $angleDir exists=$(Test-Path $angleDir)"
          if (Test-Path $angleDir) {
            Copy-Item "$angleDir\*.dll" export\windows\ -Force -ErrorAction SilentlyContinue
            Get-ChildItem export\windows\*.dll -ErrorAction SilentlyContinue | Select-Object Name, Length
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mario-angle-windows
          path: export/windows/
          if-no-files-found: warn
          retention-days: 7
